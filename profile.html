<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Profile · SCS</title>
<link rel="icon" type="image/png" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/portal.css" />
</head>
<body>
<div class="bg-art" aria-hidden="true"><span class="glow"></span><span class="ring r1"></span><span class="ring r2"></span><img data-scs-logo alt="" /></div>
<header class="top">
  <div class="in">
    <a class="logo" href="./"><span class="mk"><img data-scs-logo alt="SCS" /></span><span><b data-i="My Profile|আমার প্রোফাইল"></b><small>SCS Management</small></span></a>
    <div class="act" id="topAct"><a class="chip" href="./">🏠 <span class="hide-sm" data-i="Home|হোম"></span></a></div>
  </div>
</header>

<main class="wrap" style="max-width:820px">
  <div id="banner"></div>
  <div id="body"><div class="spin"></div></div>
</main>
<div id="toast" class="toast hidden"></div>
<input type="file" id="fPhoto" accept="image/*" class="hidden" />
<input type="file" id="fDoc" accept="image/*,application/pdf" class="hidden" />

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/scs-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var T = SCS.t, esc = SCS.esc, sb = SCS.sb;
  var st = { me: null, docs: [], urls: {}, photo: '', docKind: '' };
  var tt = null;
  function toast(t) { var e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(function () { e.classList.add('hidden'); }, 3000); }
  SCS.applyI18n(); SCS.applyLogo();
  if (!SCS.configured) { location.href = SCS.url('/'); return; }
  SCS.loadBranding();
  var next = new URLSearchParams(location.search).get('next');
  if (next && !/^\/[^/]/.test(next)) next = null;

  var KIND = {
    nid_front: T('NID — front side', 'এনআইডি — সামনের পাতা'),
    nid_back: T('NID — back side', 'এনআইডি — পেছনের পাতা'),
    certificate: T('Certificate', 'সনদপত্র'),
    other: T('Other', 'অন্যান্য')
  };

  function render() {
    var me = st.me, p = me.profile;
    var nidF = st.docs.filter(function (d) { return d.kind === 'nid_front'; })[0];
    var nidB = st.docs.filter(function (d) { return d.kind === 'nid_back'; })[0];
    var certs = st.docs.filter(function (d) { return d.kind === 'certificate' || d.kind === 'other'; });
    var photo = st.photo || p.photo_url;
    $('body').innerHTML =
      '<div class="card pad sec">' +
        '<h2 class="h2">' + T('Personal information', 'ব্যক্তিগত তথ্য') + '</h2>' +
        '<div class="photo-up" style="margin-bottom:18px">' +
          (photo ? '<img class="ph" src="' + esc(photo) + '" alt="" />' : '<div class="ph">👤</div>') +
          '<div><button type="button" class="btn g s" id="pickPhoto">📷 ' + (photo ? T('Change photo', 'ছবি বদলান') : T('Upload photo', 'ছবি আপলোড করুন')) + '</button>' +
          '<div class="small" style="margin-top:6px">' + T('Required. A clear photo of your face.', 'বাধ্যতামূলক। মুখের পরিষ্কার ছবি।') + '</div></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label class="l">' + T('Full name', 'পূর্ণ নাম') + ' <span class="req">*</span></label><input class="in-f" id="pName" value="' + esc(p.full_name || '') + '" /></div>' +
          '<div class="field"><label class="l">' + T('Mobile number', 'মোবাইল নম্বর') + ' <span class="req">*</span></label><input class="in-f" id="pPhone" inputmode="tel" placeholder="01XXXXXXXXX" value="' + esc(p.phone || '') + '" /></div>' +
        '</div>' +
        '<div class="row2">' +
          '<div class="field"><label class="l">' + T('Email', 'ইমেইল') + '</label><input class="in-f" readonly value="' + esc(me.email) + '" /></div>' +
          '<div class="field"><label class="l">' + T('Employee ID', 'এমপ্লয়ি আইডি') + '</label><input class="in-f" id="pEmp" maxlength="40" value="' + esc(p.employee_id || '') + '" placeholder="' + T('Your company employee ID (optional)', 'কোম্পানির এমপ্লয়ি আইডি (ঐচ্ছিক)') + '" /></div>' +
        '</div>' +
        ((p.designation || p.department) ? '<div class="row2"><div class="field"><label class="l">' + T('Designation', 'পদবি') + '</label><input class="in-f" readonly value="' + esc(p.designation) + '" /></div><div class="field"><label class="l">' + T('Department', 'বিভাগ') + '</label><input class="in-f" readonly value="' + esc(p.department) + '" /></div></div>' : '') +
        '<p class="small" style="margin:0 0 14px">' + T('Your name and photo are shown in Employee Attendance and all other SCS apps.', 'এই নাম ও ছবিই Employee Attendance সহ সব SCS অ্যাপে দেখাবে।') + '</p>' +
        '<button type="button" class="btn p" id="save">' + T('Save profile', 'প্রোফাইল সেভ করুন') + '</button>' +
      '</div>' +

      '<div class="card pad sec">' +
        '<h2 class="h2">' + T('National ID (NID)', 'জাতীয় পরিচয়পত্র (NID)') + ' <small>· ' + T('optional', 'ঐচ্ছিক') + '</small></h2>' +
        '<div class="docs">' + docBox(nidF, 'nid_front') + docBox(nidB, 'nid_back') + '</div>' +
      '</div>' +

      '<div class="card pad sec">' +
        '<h2 class="h2">' + T('Educational certificates', 'শিক্ষাগত যোগ্যতার সনদপত্র') + ' <small>· ' + T('optional', 'ঐচ্ছিক') + '</small></h2>' +
        '<div class="docs">' + certs.map(function (d) { return docBox(d, d.kind); }).join('') +
          '<div class="doc add" data-add="certificate">＋<br>' + T('Add certificate', 'সনদপত্র যোগ করুন') + '</div></div>' +
        '<p class="small" style="margin:10px 0 0">' + T('Photo (JPG/PNG) or PDF, up to 10 MB each. Only you and the Super Admin can see these documents.', 'ছবি (JPG/PNG) বা PDF, প্রতিটি সর্বোচ্চ ১০ MB। এই ডকুমেন্টগুলো শুধু আপনি ও Super Admin দেখতে পারবেন।') + '</p>' +
      '</div>' +

      '<div class="card pad sec">' +
        '<h2 class="h2">' + T('Change password', 'পাসওয়ার্ড বদলান') + '</h2>' +
        '<div class="row2"><div class="field"><label class="l">' + T('New password', 'নতুন পাসওয়ার্ড') + '</label><input class="in-f" type="password" id="np1" minlength="8" autocomplete="new-password" /></div>' +
        '<div class="field"><label class="l">' + T('Confirm', 'আবার দিন') + '</label><input class="in-f" type="password" id="np2" minlength="8" autocomplete="new-password" /></div></div>' +
        '<button type="button" class="btn g" id="savePass">' + T('Update password', 'পাসওয়ার্ড আপডেট') + '</button>' +
      '</div>';
    st.docs.forEach(function (d) { if (/^image\//.test(d.mime) && !st.urls[d.id]) loadThumb(d); });
  }
  function docBox(d, kind) {
    if (!d) return '<div class="doc add" data-add="' + kind + '">＋<br>' + esc(KIND[kind]) + '</div>';
    var th = st.urls[d.id] ? 'style="background-image:url(\'' + st.urls[d.id] + '\')"' : '';
    return '<div class="doc"><div class="th" ' + th + ' data-thumb="' + d.id + '">' + (/pdf/.test(d.mime) ? '📄' : (st.urls[d.id] ? '' : '🖼️')) + '</div>' +
      '<b>' + esc(d.title || KIND[d.kind]) + '</b><button type="button" class="link" data-open="' + d.id + '" style="text-align:left;font-size:12px">' + T('Open', 'খুলুন') + '</button>' +
      '<button type="button" class="x" data-del="' + d.id + '" title="' + T('Remove', 'মুছুন') + '">✕</button></div>';
  }
  function loadThumb(d) {
    SCS.signedUrl(d.path, 3600).then(function (u) {
      st.urls[d.id] = u;
      var el = document.querySelector('[data-thumb="' + d.id + '"]');
      if (el) { el.style.backgroundImage = 'url(\'' + u + '\')'; el.textContent = ''; }
    }).catch(function () {});
  }

  function load() {
    return SCS.loadMe().then(function (me) {
      if (!me) { location.href = SCS.url('/') + '?next=' + encodeURIComponent(SCS.url('/profile.html')); return; }
      st.me = me;
      $('topAct').innerHTML = '<a class="chip" href="' + esc(next || '/') + '">🏠 <span class="hide-sm">' + T('Home', 'হোম') + '</span></a>';
      SCS.portalHeader(me, $('topAct'));
      if (!me.complete) $('banner').innerHTML = '<div class="msg info" style="font-size:14px">👋 ' + T('Welcome! Please add your photo, full name and mobile number to continue.', 'স্বাগতম! চালিয়ে যেতে আপনার ছবি, পূর্ণ নাম ও মোবাইল নম্বর দিন।') + '</div>';
      return SCS.q(sb.from('profile_documents').select('*').eq('user_id', me.id).order('created_at')).then(function (d) { st.docs = d || []; render(); });
    }).catch(function (e) { $('body').innerHTML = '<div class="empty">' + esc(SCS.err(e)) + '</div>'; });
  }

  document.addEventListener('click', function (e) {
    if (e.target.closest('#pickPhoto')) { $('fPhoto').click(); return; }
    var add = e.target.closest('[data-add]');
    if (add) { st.docKind = add.getAttribute('data-add'); $('fDoc').click(); return; }
    var op = e.target.closest('[data-open]');
    if (op) {
      var d = st.docs.filter(function (x) { return x.id === op.getAttribute('data-open'); })[0];
      var w = window.open('', '_blank');
      SCS.signedUrl(d.path, 600).then(function (u) { if (w) w.location = u; else location.href = u; }).catch(function (er) { if (w) w.close(); toast(SCS.err(er)); });
      return;
    }
    var del = e.target.closest('[data-del]');
    if (del) {
      var doc = st.docs.filter(function (x) { return x.id === del.getAttribute('data-del'); })[0];
      if (!confirm(T('Remove this document?', 'এই ডকুমেন্টটি মুছবেন?'))) return;
      SCS.q(sb.from('profile_documents').delete().eq('id', doc.id)).then(function () { return SCS.removeFile(doc.path).catch(function () {}); })
        .then(function () { st.docs = st.docs.filter(function (x) { return x.id !== doc.id; }); render(); toast(T('Removed', 'মুছে ফেলা হয়েছে')); })
        .catch(function (er) { toast(SCS.err(er)); });
      return;
    }
    if (e.target.closest('#save')) saveProfile();
    if (e.target.closest('#savePass')) savePass();
  });

  $('fPhoto').onchange = function () {
    var f = this.files[0]; this.value = '';
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast(T('Choose an image file', 'ছবির ফাইল দিন')); return; }
    toast(T('Uploading photo…', 'ছবি আপলোড হচ্ছে…'));
    SCS.resizeImage(f, 640, 0.86).then(function (b) {
      return SCS.uploadPublic('avatars/' + st.me.id + '/photo-' + Date.now() + '.jpg', b, 'image/jpeg');
    }).then(function (url) {
      st.photo = url;
      return SCS.q(sb.from('profiles').update({ photo_url: url }).eq('id', st.me.id));
    }).then(function () { st.me.profile.photo_url = st.photo; render(); toast(T('Photo saved', 'ছবি সেভ হয়েছে')); })
      .catch(function (er) { toast(SCS.err(er)); });
  };

  $('fDoc').onchange = function () {
    var f = this.files[0]; this.value = '';
    if (!f) return;
    if (!/^image\/|application\/pdf/.test(f.type)) { toast(T('Use an image or a PDF', 'ছবি বা PDF দিন')); return; }
    if (f.size > 10 * 1024 * 1024) { toast(T('File is larger than 10 MB', 'ফাইল ১০ MB এর বেশি')); return; }
    var kind = st.docKind, title = KIND[kind];
    if (kind === 'certificate') {
      title = prompt(T('Certificate name (e.g. SSC, HSC, B.Sc.)', 'সনদপত্রের নাম (যেমন SSC, HSC, B.Sc.)'), '');
      if (title === null) return;
      title = title.trim() || T('Certificate', 'সনদপত্র');
    }
    toast(T('Uploading…', 'আপলোড হচ্ছে…'));
    var isImg = /^image\//.test(f.type);
    (isImg ? SCS.resizeImage(f, 2000, 0.88) : Promise.resolve(f)).then(function (b) {
      var ext = isImg ? 'jpg' : 'pdf';
      var path = 'profiles/' + st.me.id + '/' + kind + '-' + Date.now() + '.' + ext;
      return SCS.upload(path, b, isImg ? 'image/jpeg' : 'application/pdf').then(function () {
        var old = (kind === 'nid_front' || kind === 'nid_back') ? st.docs.filter(function (d) { return d.kind === kind; }) : [];
        return Promise.all(old.map(function (d) { return SCS.q(sb.from('profile_documents').delete().eq('id', d.id)).then(function () { return SCS.removeFile(d.path).catch(function () {}); }); }))
          .then(function () { return SCS.q(sb.from('profile_documents').insert({ user_id: st.me.id, kind: kind, title: title, path: path, mime: isImg ? 'image/jpeg' : 'application/pdf', size: b.size }).select().single()); });
      });
    }).then(function (row) {
      st.docs = st.docs.filter(function (d) { return !((kind === 'nid_front' || kind === 'nid_back') && d.kind === kind); }).concat([row]);
      render(); toast(T('Uploaded', 'আপলোড হয়েছে'));
    }).catch(function (er) { toast(SCS.err(er)); });
  };

  function saveProfile() {
    var name = $('pName').value.trim(), phone = $('pPhone').value.replace(/[\s-]/g, '');
    if (!name) { toast(T('Enter your full name', 'পূর্ণ নাম দিন')); return; }
    if (!/^(\+?88)?01[3-9]\d{8}$/.test(phone)) { toast(T('Enter a valid mobile number', 'সঠিক মোবাইল নম্বর দিন')); return; }
    if (!(st.photo || st.me.profile.photo_url)) { toast(T('Upload your photo', 'আপনার ছবি আপলোড করুন')); return; }
    $('save').disabled = true;
    var emp = $('pEmp').value.trim();
    var upd = { full_name: name, phone: phone };
    if (emp !== (st.me.profile.employee_id || '')) upd.employee_id = emp || null;
    SCS.q(sb.from('profiles').update(upd).eq('id', st.me.id).select('id')).then(function (rows) {
      if (!rows || !rows.length) throw new Error(T('Not saved — please try again.', 'সেভ হয়নি — আবার চেষ্টা করুন।'));
      toast(T('Profile saved', 'প্রোফাইল সেভ হয়েছে'));
      var wasIncomplete = !st.me.complete;
      if (wasIncomplete) { setTimeout(function () { location.href = next || SCS.url('/'); }, 700); return; }
      return load();
    }).catch(function (er) { toast(/duplicate|unique/i.test(SCS.err(er)) ? T('This Employee ID is already used by someone else.', 'এই Employee ID অন্য কারো আছে।') : SCS.err(er)); }).then(function () { var b = $('save'); if (b) b.disabled = false; });
  }
  function savePass() {
    var a = $('np1').value, b = $('np2').value;
    if (a.length < 8) { toast(T('At least 8 characters', 'কমপক্ষে ৮ অক্ষর')); return; }
    if (a !== b) { toast(T('The two passwords do not match', 'দুটি পাসওয়ার্ড মিলছে না')); return; }
    sb.auth.updateUser({ password: a }).then(function (r) {
      if (r.error) { toast(r.error.message); return; }
      $('np1').value = ''; $('np2').value = ''; toast(T('Password updated', 'পাসওয়ার্ড আপডেট হয়েছে'));
    });
  }

  load();
})();
</script>
</body>
</html>
