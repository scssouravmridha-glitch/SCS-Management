.dark select option{background:#0f172a;color:#f1f5f9}

/* ---- voucher sheet (screen preview + print) ---- */
.voucher-sheet{position:relative;width:100%;min-width:680px;max-width:210mm;margin:0 auto;padding:10mm 11mm;background:#fff;color:#0f172a;font-family:Inter,"Hind Siliguri",Arial,sans-serif;font-size:12px;overflow:hidden}
.vx-stamp{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:54px;font-weight:900;letter-spacing:4px;border:6px solid;border-radius:14px;padding:4px 22px;opacity:.09;pointer-events:none;white-space:nowrap}
.vx-head{display:flex;align-items:center;gap:14px;padding-bottom:8px;border-bottom:3px double #0f172a}
.vx-logo{width:66px;height:66px;border-radius:9999px;object-fit:contain;background:#fff}
.vx-co{flex:1;text-align:center}
.vx-name{font-size:21px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;line-height:1.15}
.vx-tag{font-size:11.5px;font-style:italic;font-weight:600;color:#db2777;margin-top:2px}
.vx-addr{font-size:10.5px;color:#334155;margin-top:2px}
.vx-box{border:1.5px solid #0f172a;border-radius:6px;font-size:10.5px;min-width:150px}
.vx-box>div{display:flex;flex-direction:column;padding:3px 8px}
.vx-box>div+div{border-top:1px solid #0f172a}
.vx-box span{font-size:9px;text-transform:uppercase;color:#475569;font-weight:700}
.vx-box b{font-family:"JetBrains Mono",monospace;font-size:11px}
.vx-title{margin:10px auto 10px;width:max-content;padding:4px 26px;background:#1e293b;color:#fff;font-weight:900;letter-spacing:2px;font-size:14px;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vx-info,.vx-items{width:100%;border-collapse:collapse}
.vx-info th,.vx-info td{border:1px solid #475569;padding:5px 8px;text-align:left;font-size:11.5px}
.vx-info th{background:#f1f5f9;width:17%;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vx-info td{width:33%;font-weight:600}
.vx-items{margin-top:10px}
.vx-items th{background:#d9e3f0;border:1px solid #1e293b;padding:6px;font-weight:800;font-size:11.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vx-items td{border:1px solid #475569;padding:5px 7px;font-size:11.5px;height:24px}
.vx-items tfoot td{background:#f1f5f9;border:1px solid #1e293b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vx-c{text-align:center}.vx-r{text-align:right;font-family:"JetBrains Mono",monospace}
.vx-note{margin-top:8px;padding:6px 9px;border:1px dashed #e11d48;border-radius:6px;font-size:11px;color:#9f1239}
.vx-sig{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:18px;margin-top:52px;text-align:center}
.vx-line{border-top:1.5px solid #0f172a;margin-bottom:3px}
.vx-sl{font-size:11px;font-weight:700}.vx-sn{font-size:11px;font-weight:800}.vx-ss{font-size:9.5px;color:#475569}
.vx-foot{display:flex;justify-content:space-between;margin-top:18px;padding-top:5px;border-top:1px solid #cbd5e1;font-size:9px;color:#64748b}

/* ---- printing ---- */
#print-area{display:none}
@page{size:A4 landscape;margin:8mm}
@page voucher{size:A4 portrait;margin:6mm}
@media print{
  html,body{background:#fff!important;overflow:visible!important}
  body.printing #root,body.printing #modal-root,body.printing #toast-root,body.printing #scs-busy{display:none!important}
  body.printing #print-area{display:block!important}
  .no-print{display:none!important}
  .print-voucher{page:voucher}
  .print-voucher .voucher-sheet{min-width:0;max-width:none;width:100%;padding:2mm 3mm}
  .print-voucher .vx-stamp{opacity:.12}
  .print-report{color:#0f172a;font-size:10px}
  .print-report .scs-hdr-logo{display:block!important;top:-6px!important;height:calc(100% + 4px)!important}
  .print-report .sm\:hidden{display:none!important}
  .print-report .scs-hscroll{overflow:visible!important;border:0!important}
  .print-table{border-collapse:collapse!important;width:100%!important;font-size:10px!important}
  .print-table th,.print-table td{color:#0f172a!important;border:1px solid #1e293b!important;padding:3px 5px!important;white-space:normal!important}
  .print-table thead th{background:#d9e3f0!important;font-weight:800!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-table tfoot td{background:#e5eaf1!important;font-weight:800!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-table tbody tr:nth-child(even) td{background:#f4f7fb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-table span[class*="rounded-full"]{border:0!important;background:none!important;padding:0!important}
  .print-table svg{display:none!important}
  thead{display:table-header-group}tr{break-inside:avoid;page-break-inside:avoid}
  .scs-sig-grid,.scs-sig-grid *{color:#0f172a!important}
  .scs-sig-grid .border-t{border-top:1.5px solid #0f172a!important}
}

/* ---- user's VOUCHER FORM (scanned form + data overlay, positions in pt) ---- */
.vf-page{background:#fff;color:#0f172a}
.vf-form{position:relative;width:841.89pt;height:595.28pt;overflow:hidden;font-family:Arial,Helvetica,"Hind Siliguri",sans-serif;font-size:10.5pt;line-height:1.1;color:#0b1220;background:#fff}
.vf-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.vf-t{position:absolute;display:flex;align-items:center;padding:0 3pt}
.vf-sm{font-size:8pt;font-weight:500}
.vf-mute{color:#475569}
.vf-status{font-size:7.5pt;font-weight:800;letter-spacing:.5pt;color:#b45309;border:1px solid #f59e0b;border-radius:3pt;padding:1pt 4pt;background:#fffbeb}
.vf-preview-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:max-content}
.vf-preview-wrap .vf-form{box-shadow:0 1px 4px rgba(15,23,42,.15)}
@page vform-a4{size:A4 landscape;margin:0}
@media print{
  .print-voucher .vf-page{break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-voucher .vf-page:last-child{break-after:auto;page-break-after:auto}
  .print-voucher .vf-paper-a4{page:vform-a4;height:594pt}
  .print-voucher .vf-status{background:#fff}
}
.vf-in{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.vf-paper-a4{position:relative;width:841.89pt;height:595.28pt;overflow:hidden;background:#fff}
.vf-preview-wrap .vf-paper-a4{box-shadow:0 1px 4px rgba(15,23,42,.15)}
.vf-preview-wrap .vf-paper-a4 .vf-form{box-shadow:none}

.xtab th,.xtab td{border-width:1.5px}

.ctab td,.ctab th{text-align:center}
.ctab td.tl,.ctab th.tl{text-align:left}

/* readable muted text: darker greys in light mode, lighter in dark mode */
.dark{--color-slate-400: oklch(0.869 0.022 252.894);--color-slate-500: oklch(0.869 0.022 252.894)}
.bg-slate-900,.bg-slate-800,.bg-slate-950{--color-slate-400: oklch(0.869 0.022 252.894);--color-slate-500: oklch(0.869 0.022 252.894)}
.ctab .font-mono{white-space:nowrap}

button:disabled{opacity:.4;cursor:not-allowed!important;filter:grayscale(.6)}
