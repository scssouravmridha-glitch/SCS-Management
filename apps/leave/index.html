    <div id="toast" class="toast hidden"></div>
    <div id="loader" class="loader hidden"><div class="loader-box"><div class="spinner"></div><div id="loaderText" style="font-size:13px;font-weight:700">Processing...</div></div></div>

    <script>
      var state = {
        view: "dashboard",
        approverUnlocked: false,
        approverTab: "applications",
        approverFilter: "Pending",
        managerTab: "employees",
        historyFilter: "All",
        manualDays: false,
        selectedEmployeeId: "",
        editingEmployeeId: "",
        employees: [],
        applications: [],
        notifications: [],
        globalConfig: { leaveTypes: "", approvers: "" },
        noticeSeenKey: "",
      };

      var pinModalResolver = null;

      function showLoader(text) {
        document.getElementById("loaderText").innerText = text || "Processing...";
        document.getElementById("loader").classList.remove("hidden");
      }

      function hideLoader() {
        document.getElementById("loader").classList.add("hidden");
      }

      async function runWithLoader(text, fn) {
        showLoader(text);
        try {
          return await fn();
        } finally {
          hideLoader();
        }
      }

      function callServer(name, args) {
        return new Promise(function(resolve, reject) {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject)[name].apply(google.script.run, args || []);
        });
      }

      function showToast(text) {
        var el = document.getElementById("toast");
        el.innerText = text;
        el.classList.remove("hidden");
        setTimeout(function() {
          el.classList.add("hidden");
        }, 2200);
      }

      function h(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function initPinPad() {
        var keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "DEL", "0", "OK"];
        document.getElementById("pinPad").innerHTML = keys.map(function(k) {
          return '<button class="key" onclick="tapPin(\'' + k + '\')">' + k + "</button>";
        }).join("");
        var loginBtn = document.querySelector(".login-btn, .btn.g[style*='font-size: 42px']");
        if (loginBtn) loginBtn.onclick = doLogin;
        document.getElementById("pinInput").addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            doLogin();
          }
        });

        var pinPadHtml = keys.map(function(k) {
          return '<button class="key" style="height:56px;font-size:26px;border-radius:14px" onclick="tapModalPin(\'' + k + '\')">' + k + "</button>";
        }).join("");
        document.getElementById("pinModalPad").innerHTML = pinPadHtml;
        document.getElementById("pinModalInput").addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            confirmPinModal();
          }
        });
      }

      function openPinModal(title) {
        document.getElementById("pinModalTitle").innerText = title || "Admin PIN";
        document.getElementById("pinModalInput").value = "";
        document.getElementById("pinModal").classList.remove("hidden");
        document.getElementById("pinModalInput").focus();
        return new Promise(function(resolve) {
          pinModalResolver = resolve;
        });
      }

      function closePinModal() {
        document.getElementById("pinModal").classList.add("hidden");
        if (pinModalResolver) {
          pinModalResolver("");
          pinModalResolver = null;
        }
      }

      function tapModalPin(key) {
        var input = document.getElementById("pinModalInput");
        if (key === "DEL") {
          input.value = input.value.slice(0, -1);
          return;
        }
        if (key === "OK") {
          confirmPinModal();
          return;
        }
        input.value = (input.value + key).slice(0, 4);
      }

      function confirmPinModal() {
        var value = document.getElementById("pinModalInput").value.trim();
        document.getElementById("pinModal").classList.add("hidden");
        if (pinModalResolver) {
          pinModalResolver(value);
          pinModalResolver = null;
        }
      }

      function tapPin(key) {
        var input = document.getElementById("pinInput");
        if (key === "DEL") {
          input.value = input.value.slice(0, -1);
          return;
        }
        if (key === "OK") {
          doLogin();
          return;
        }
        input.value = (input.value + key).slice(0, 4);
      }

      async function doLogin() {
        var pin = document.getElementById("pinInput").value.trim();
        var res = await runWithLoader("Checking login...", function() {
          return callServer("verifyLoginPin", [pin]);
        });
        if (!res || !res.ok) {
          showToast("Invalid PIN");
          return;
        }
        document.getElementById("loginView").classList.add("hidden");
        document.getElementById("appView").classList.remove("hidden");
        await loadData();
      }

      function logout() {
        state.approverUnlocked = false;
        state.view = "form";
        document.getElementById("appView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
      }

      async function loadData() {
        var res = await runWithLoader("Loading data...", function() {
          return callServer("getBootstrapData", []);
        });
        if (!res || !res.ok) {
          showToast("Failed to load data");
          return;
        }
        state.employees = res.employees || [];
        state.applications = res.applications || [];
        state.notifications = res.notifications || [];
        state.globalConfig = res.globalConfig || state.globalConfig;
        try {
          state.noticeSeenKey = localStorage.getItem("scs_notice_seen_key") || "";
        } catch (e) {
          state.noticeSeenKey = "";
        }
        if (!state.selectedEmployeeId && state.employees[0]) state.selectedEmployeeId = state.employees[0].employeeId;
        renderAll();
      }

      async function syncNow() {
        var res = await runWithLoader("Synchronizing...", function() {
          return callServer("syncNow", []);
        });
        if (!res || !res.ok) {
          showToast("Sync failed");
          return;
        }
        state.employees = res.employees || [];
        state.applications = res.applications || [];
        state.notifications = res.notifications || [];
        state.globalConfig = res.globalConfig || state.globalConfig;
        renderAll();
        showToast("Synchronized");
      }

      function setView(view) {
        state.view = view;
        renderViews();
      }

      function renderViews() {
        document.getElementById("dashboardView").classList.toggle("hidden", state.view !== "dashboard");
        document.getElementById("formView").classList.toggle("hidden", state.view !== "form");
        document.getElementById("historyView").classList.toggle("hidden", state.view !== "history");
        document.getElementById("approverView").classList.toggle("hidden", state.view !== "approver");
      }

      async function openApprover() {
        if (!state.approverUnlocked) {
          var pin = await openPinModal("Admin Security PIN");
          var res = await runWithLoader("Verifying admin...", function() {
            return callServer("verifyAdminPin", [pin]);
          });
          if (!res || !res.ok) {
            showToast("Invalid admin PIN");
            return;
          }
          state.approverUnlocked = true;
        }
        state.view = "approver";
        renderViews();
        renderApprover();
      }

      function currentEmployee() {
        return state.employees.find(function(e) { return e.employeeId === state.selectedEmployeeId; }) || null;
      }

      function nextLAID() {
        var d = new Date();
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var prefix = "SCS" + y + m + "-";
        var count = state.applications.filter(function(a) {
          return String(a.applicationId || "").indexOf(prefix) === 0;
        }).length;
        return prefix + String(count + 1).padStart(2, "0");
      }

      function avatarHtml(emp, size) {
        var cls = size === "lg" ? "avatar-lg" : "avatar-sm";
        if (!emp) return '<div class="' + cls + '">?</div>';
        var initial = h((emp.name || "E").slice(0, 1).toUpperCase());
        if (emp.photo) {
          return '<div class="' + cls + '">' + initial + '<img src="' + h(emp.photo) + '" alt="" onerror="this.remove()" /></div>';
        }
        return '<div class="' + cls + '">' + initial + "</div>";
      }

      function renderSelectedEmployee() {
        var emp = currentEmployee();
        document.getElementById("selectedAvatar").innerHTML = emp
          ? (h((emp.name || "E").slice(0, 1).toUpperCase()) + (emp.photo ? '<img src="' + h(emp.photo) + '" alt="" onerror="this.remove()" />' : ""))
          : "Select";

        document.getElementById("selectedMeta").innerHTML = emp
          ? "<div><b>" + h(emp.name) + "</b></div><div>" + h(emp.designation) + "</div><div>ID: " + h(emp.employeeId) + "</div><div>Mobile: " + h(emp.mobile) + "</div>"
          : "";

        document.getElementById("fName").value = emp ? emp.name : "";
        document.getElementById("fDesignation").value = emp ? emp.designation : "";
        document.getElementById("fMobile").value = emp ? emp.mobile : "";
        document.getElementById("fLaid").value = nextLAID();

        var list = (emp && emp.typeOfLeave ? emp.typeOfLeave : (state.globalConfig.leaveTypes || ""))
          .split(",")
          .map(function(x) { return x.trim(); })
          .filter(Boolean);
        document.getElementById("fType").innerHTML = list
          .map(function(type) { return '<option value="' + h(type) + '">' + h(type) + "</option>"; })
          .join("");
      }

      function openEmployeePicker() {
        document.getElementById("employeePickerModal").classList.remove("hidden");
        document.getElementById("employeeSearch").value = "";
        renderEmployeePicker();
      }

      function closeEmployeePicker() {
        document.getElementById("employeePickerModal").classList.add("hidden");
      }

      function renderEmployeePicker() {
        var q = (document.getElementById("employeeSearch").value || "").toLowerCase().trim();
        var list = state.employees.filter(function(emp) {
          if (!q) return true;
          return (
            String(emp.employeeId || "").toLowerCase().indexOf(q) > -1 ||
            String(emp.name || "").toLowerCase().indexOf(q) > -1 ||
            String(emp.designation || "").toLowerCase().indexOf(q) > -1
          );
        });

        document.getElementById("employeePickerList").innerHTML = list.map(function(emp) {
          var av = avatarHtml(emp, "sm");

          return (
            '<button style="display:flex;width:100%;align-items:center;gap:8px;border:0;border-bottom:1px solid #e2e8f0;background:#fff;padding:8px;text-align:left;cursor:pointer" onclick="pickEmployee(\'' + h(emp.employeeId) + '\')">' +
            av +
            "<div><div><b>" + h(emp.employeeId) + " - " + h(emp.name) + "</b></div><div>" + h(emp.designation) + "</div></div></button>"
          );

      function pickEmployee(id) {
        state.selectedEmployeeId = id;
        closeEmployeePicker();
        renderSelectedEmployee();
      }

      function onDateChange() {
        if (state.manualDays) return;
        var from = document.getElementById("fFrom").value;
        var to = document.getElementById("fTo").value;
        if (!from || !to) return;
        var diff = Math.floor((new Date(to).getTime() - new Date(from).getTime()) / 86400000) + 1;
        document.getElementById("fDays").value = diff > 0 ? diff : 0;
      }

      function clearForm() {
        document.getElementById("fFrom").value = "";
        document.getElementById("fTo").value = "";
        document.getElementById("fDays").value = "0";
        document.getElementById("fDescription").value = "";
        state.manualDays = false;
      }

      async function submitLeave(event) {
        event.preventDefault();
        var emp = currentEmployee();
        if (!emp) return showToast("Select employee");

        var payload = {
          employeeId: emp.employeeId,
          fromDate: document.getElementById("fFrom").value,
          toDate: document.getElementById("fTo").value,
          totalDays: Number(document.getElementById("fDays").value || 0),
          leaveType: document.getElementById("fType").value,
          description: document.getElementById("fDescription").value,
        };

        if (!payload.fromDate || !payload.toDate || !payload.leaveType || payload.totalDays <= 0) {
          return showToast("Fill all fields correctly");
        }

        var res = await runWithLoader("Submitting application...", function() {
          return callServer("submitLeaveApplication", [payload]);
        });
        if (!res || !res.ok) return showToast((res && res.error) || "Submit failed");
        state.employees = res.employees || state.employees;
        state.applications = res.applications || state.applications;
        state.notifications = res.notifications || state.notifications;
        state.globalConfig = res.globalConfig || state.globalConfig;
        clearForm();
        renderAll();
        showToast("Application submitted");
      }

        state.historyFilter = filter;
        renderHistory();
      }

        return (

          '<div>Designation: ' + h(app.designation) + ' | Mobile: ' + h(app.mobile) + '</div>' +
          '<div>From: ' + h(app.fromDate) + ' | To: ' + h(app.toDate) + '</div>' +
          '<div>Total Days: ' + h(app.totalDays) + ' | Type: ' + h(app.leaveType) + '</div>' +

        var pending = state.applications.filter(function(a) { return a.status === "Pending"; }).length;
        var approved = state.applications.filter(function(a) { return a.status === "Approved"; }).length;
        document.getElementById("pendingBtn").innerText = "Pending (" + pending + ")";
        document.getElementById("approvedBtn").innerText = "Approved (" + approved + ")";

        var list = state.applications.filter(function(a) { return a.status === state.historyFilter; });
        document.getElementById("historyList").innerHTML = list.length
          ? list.map(function(app) { return applicationCard(app, "history"); }).join("")
          : "<div class='rowcard'>No applications.</div>";

        var summaryRows = state.employees.map(function(emp) {

        document.getElementById("approverSheet").classList.toggle("hidden", state.approverTab !== "sheet");

        if (state.approverTab === "applications") {

          var approved = state.applications.filter(function(a) { return a.status === "Approved"; }).length;
          document.getElementById("approverPendingBtn").innerText = "Pending (" + pending + ")";
          document.getElementById("approverApprovedBtn").innerText = "Approved (" + approved + ")";

            return app.status === state.approverFilter;
          });
          document.getElementById("approverApplicationsList").innerHTML = filtered.length

      function employeeSummary(emp) {
        var apps = state.applications.filter(function(a) { return a.employeeId === emp.employeeId; });
        var taken = apps.filter(function(a) { return a.status === "Approved"; }).reduce(function(s, a) { return s + Number(a.totalDays || 0); }, 0);
        var remaining = Math.max(0, Number(emp.acceptableLeaveDays || 12) - taken);
        return { apps: apps, taken: taken, remaining: remaining };
      }

        var rows = state.employees.map(function(emp) {
          var sum = employeeSummary(emp);
          var av = avatarHtml(emp, "sm");

          return (
            '<tr>' +

            '<td>' + h(emp.designation) + '</td>' +
            '<td>' + h(emp.acceptableLeaveDays) + ' days</td>' +
            '<td style="color:#166534">' + sum.taken + ' days</td>' +
            '<td style="color:#e5007d">' + sum.remaining + ' days</td>' +
            '<td><button class="btn g" onclick="printSummaryPerson(\'' + h(emp.employeeId) + '\')">Print Summary</button></td>' +
            '</tr>'

          var av = avatarHtml(emp, "sm");

          '<div class="table-wrap"><table><tr><th>SL</th><th>Photo</th><th>Name</th><th>Designation</th><th>Mobile</th><th>ID</th><th>Leave Quota</th><th>Approver(s)</th><th>Actions</th></tr>' + rows + '</table></div>';
      }

      function renderRecordTable() {
        var approved = state.applications.filter(function(a) { return a.status === "Approved"; });
        var byEmp = {};
        var maxBlocks = 0;
        state.employees.forEach(function(emp) {
          byEmp[emp.employeeId] = approved.filter(function(a) { return a.employeeId === emp.employeeId; });
          if (byEmp[emp.employeeId].length > maxBlocks) maxBlocks = byEmp[emp.employeeId].length;
        });

        var html = '<div style="text-align:right;margin-bottom:6px"><button class="btn b" onclick="printLeaveRecord()">Print</button></div><div class="table-wrap"><table style="border:2px solid #334155">';
        html += '<tr><td style="border:2px solid #334155;background:#e5007d;color:#fff"><b>EMPLOYEE NAME</b></td>';
        state.employees.forEach(function(emp, i) {
          html += '<td style="border:2px solid #334155;background:#e5007d;color:#fff"><b>' + (i + 1) + '. ' + h(emp.name) + '</b></td>';
        });
        html += '</tr>';

        function row(label, getter) {
          html += '<tr><td style="background:#f472b6;color:#fff"><b>' + label + '</b></td>';
          state.employees.forEach(function(emp) {
            html += '<td>' + getter(emp) + '</td>';
          });
          html += '</tr>';
        }

        row('Designation', function(emp) { return h(emp.designation); });
        row('Mobile Number', function(emp) { return h(emp.mobile); });
        row('Employee ID', function(emp) { return h(emp.employeeId); });

        for (var i = 0; i < maxBlocks; i += 1) {
          html += '<tr><td colspan="' + (state.employees.length + 1) + '" style="border:2px solid #334155;background:#e2e8f0"><b>APPROVED LEAVE BLOCK #' + (i + 1) + '</b></td></tr>';
          row('Purpose of Leave', function(emp) {
            var app = byEmp[emp.employeeId][i];
            return app ? h(app.leaveType + (app.description ? ' - ' + app.description : '')) : '-';
          });
          row('From', function(emp) { var app = byEmp[emp.employeeId][i]; return app ? h(app.fromDate) : '-'; });
          row('To', function(emp) { var app = byEmp[emp.employeeId][i]; return app ? h(app.toDate) : '-'; });
          row('Leave of Days', function(emp) { var app = byEmp[emp.employeeId][i]; return app ? h(app.totalDays) + ' days' : '-'; });
          row('Approve by', function(emp) { var app = byEmp[emp.employeeId][i]; return app ? h(app.approvedBy || '-') : '-'; });
        }

        row('Total (Total Approved Days)', function(emp) {
          var total = byEmp[emp.employeeId].reduce(function(s, a) { return s + Number(a.totalDays || 0); }, 0);
          return total + ' days';
        });
        row('Leave Balance (Remaining Days)', function(emp) {
          var total = byEmp[emp.employeeId].reduce(function(s, a) { return s + Number(a.totalDays || 0); }, 0);
          return Math.max(0, Number(emp.acceptableLeaveDays || 12) - total) + ' days';
        });

        html += '</table></div>';
        document.getElementById("managerRecord").innerHTML = html;
      }

        var pin = await openPinModal("Admin PIN For Save");
        var base = state.editingEmployeeId
          ? state.employees.find(function(e) { return e.employeeId === state.editingEmployeeId; })

      function updateStateFromServer(res) {
        state.employees = res.employees || state.employees;
        state.applications = res.applications || state.applications;
        state.notifications = res.notifications || state.notifications;
        state.globalConfig = res.globalConfig || state.globalConfig;
        renderAll();

      function toggleNotifications() {
        var panel = document.getElementById("notificationPanel");
        panel.classList.toggle("hidden");
        if (!panel.classList.contains("hidden")) {
          state.noticeSeenKey = latestNoticeKey();
          try {
            localStorage.setItem("scs_notice_seen_key", state.noticeSeenKey);
          } catch (e) {}
          renderNotifications();
        }
      }

      function latestNoticeKey() {
        if (!state.notifications.length) return "";
        var n = state.notifications[0];
        return String(n.time || "") + "|" + String(n.message || "");
      }

      function renderNotifications() {
        var badge = document.getElementById("noteBadge");
        var latestKey = latestNoticeKey();
        if (state.notifications.length > 0 && latestKey !== state.noticeSeenKey) {
          badge.classList.remove("hidden");
          badge.innerText = state.notifications.length > 9 ? "9+" : state.notifications.length;
        } else {
          badge.classList.add("hidden");
          badge.innerText = "";
        }

        var panel = document.getElementById("notificationPanel");
        panel.innerHTML = state.notifications.length
          ? state.notifications.slice(0, 10).map(function(n) {
              return '<div style="border-bottom:1px solid #e2e8f0;padding:4px 0"><div>' + h(n.message) + '</div><div style="color:#64748b">' + h(n.time) + '</div></div>';
            }).join("")

      function openPrintWindow(title, bodyHtml) {
        var frame = document.createElement("iframe");
        frame.style.position = "fixed";
        frame.style.right = "0";
        frame.style.bottom = "0";
        frame.style.width = "0";
        frame.style.height = "0";
        frame.style.border = "0";
        document.body.appendChild(frame);

        var doc = frame.contentWindow.document;
        doc.open();
        doc.write(
          '<!doctype html><html><head><meta charset="utf-8" />' +
          '<meta name="viewport" content="width=device-width, initial-scale=1" />' +
          '<title>' + h(title) + '</title>' +
          '<style>@page{size:A4;margin:10mm}body{font-family:Arial;margin:0;color:#0f172a}.head{background:#e5007d;color:#fff;text-align:center;padding:10px;font-weight:700}.sec{border:1px solid #334155;margin:8px 0}.sec h3{margin:0;padding:8px;background:#f1f5f9;border-bottom:1px solid #cbd5e1}.pad{padding:8px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#0f172a;color:#fff}th,td{border:1px solid #94a3b8;padding:6px;vertical-align:top}</style></head><body>' +
          bodyHtml + '</body></html>'
        );
        doc.close();

        setTimeout(function() {
          frame.contentWindow.focus();
          frame.contentWindow.print();
          setTimeout(function() { document.body.removeChild(frame); }, 800);
        }, 220);
      }

        }).join("");

        openPrintWindow("Employee List", html);
      }

      function printLeaveRecord() {
        var approved = state.applications.filter(function(a) { return a.status === "Approved"; });
        var byEmp = {};
        var maxBlocks = 0;
        state.employees.forEach(function(emp) {
          byEmp[emp.employeeId] = approved.filter(function(a) { return a.employeeId === emp.employeeId; });
          if (byEmp[emp.employeeId].length > maxBlocks) maxBlocks = byEmp[emp.employeeId].length;
        });

        var headCells = state.employees.map(function(emp, i) {
          return '<th>' + (i + 1) + '. ' + h(emp.name) + '<br/>' + h(emp.employeeId) + '</th>';
        }).join("");

        var bodyRows = '';
        for (var i = 0; i < maxBlocks; i += 1) {
          bodyRows += '<tr><td colspan="' + (state.employees.length + 1) + '" style="background:#e2e8f0;font-weight:700;border:2px solid #334155">APPROVED LEAVE BLOCK #' + (i + 1) + '</td></tr>';
          var labels = ["Purpose", "From", "To", "Days", "Approve by"];
          labels.forEach(function(label) {
            bodyRows += '<tr><td><b>' + label + '</b></td>';
            state.employees.forEach(function(emp) {
              var app = byEmp[emp.employeeId][i];
              var val = '-';
              if (app) {
                if (label === "Purpose") val = app.leaveType + (app.description ? ' - ' + app.description : '');
                if (label === "From") val = app.fromDate;
                if (label === "To") val = app.toDate;
                if (label === "Days") val = app.totalDays + ' days';
                if (label === "Approve by") val = app.approvedBy || '-';
              }
              bodyRows += '<td>' + h(val) + '</td>';
            });
            bodyRows += '</tr>';
          });
        }

        var totalRow = '<tr><td><b>Total Approved Days</b></td>';
        var balRow = '<tr><td><b>Leave Balance</b></td>';
        state.employees.forEach(function(emp) {
          var t = byEmp[emp.employeeId].reduce(function(s, a) { return s + Number(a.totalDays || 0); }, 0);
          totalRow += '<td>' + t + ' days</td>';
          balRow += '<td>' + Math.max(0, Number(emp.acceptableLeaveDays || 12) - t) + ' days</td>';
        });
        totalRow += '</tr>';
        balRow += '</tr>';

        var html = '<div class="sec"><h3>Leave Record</h3><div class="pad"><table><tr><th>Employee</th>' + headCells + '</tr>' + bodyRows + totalRow + balRow + '</table></div></div>';
        openPrintWindow("Leave Record", html);
      }

      async function saveGlobalConfig() {
        var pin = await openPinModal("Admin PIN For Apply");
        var leaveTypes = document.getElementById("gTypes").value;
        var approvers = document.getElementById("gApprovers").value;
        var res = await runWithLoader("Applying global settings...", function() {
          return callServer("saveGlobalConfig", [leaveTypes, approvers, true, pin]);
        });
        if (!res || !res.ok) return showToast((res && res.error) || "Save failed");
        applyServerState(res);
      }

      function applyServerState(res) {
        state.employees = res.employees || state.employees;
        state.applications = res.applications || state.applications;
        state.notifications = res.notifications || state.notifications;
        state.globalConfig = res.globalConfig || state.globalConfig;
        if (!state.selectedEmployeeId && state.employees[0]) state.selectedEmployeeId = state.employees[0].employeeId;
        renderAll();
      }

      function renderAll() {
        renderViews();
        renderDashboard();
        renderSelectedEmployee();
        renderHistory();
        renderApprover();
        renderNotifications();
      }

      initPinPad();

    var lab=x==='CLEAR'?'CLEAR':(x==='DEL'?'&#9003;':x);

  document.getElementById('loginGo').onclick=function(){doLogin();};
}
var loginBusy=false;
function tapPin(key){
  if(loginBusy)return;var i=document.getElementById('pinInput');
  if(key==='CLEAR')i.value='';else if(key==='DEL')i.value=i.value.slice(0,-1);else if(key==='OK'){doLogin();return;}else i.value=(i.value+key).slice(0,4);
  updateDots();if(i.value.length===4&&/^\d$/.test(key))setTimeout(doLogin,80);
}
var _doLogin=doLogin;
doLogin=async function(){
  if(loginBusy)return;loginBusy=true;
  try{await _doLogin();}finally{loginBusy=false;}
  if(!document.getElementById('loginView').classList.contains('hidden')){
    var c=document.getElementById('loginCard');c.classList.add('bad');
    setTimeout(function(){c.classList.remove('bad');document.getElementById('pinInput').value='';updateDots();},450);
  }
};

  if(document.getElementById('loginView').classList.contains('hidden'))return;
  if(/^\d$/.test(e.key))tapPin(e.key);else if(e.key==='Backspace')tapPin('DEL');else if(e.key==='Escape')tapPin('CLEAR');else if(e.key==='Enter'){e.preventDefault();doLogin();}
});

function isoDay(v){var m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];var d=new Date(v);if(isNaN(d.getTime()))return '';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

function kpiCard(t,v,sub,c,ic){return '<div class="kpi"><div><small>'+t+'</small><b>'+v+'</b><span>'+sub+'</span></div><div class="ico" style="background:'+c+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+KI[ic]+'</svg></div></div>';}

};

var RX=[[/^Pending \((\d+)\)$/,'পেন্ডিং ($1)'],[/^Approved \((\d+)\)$/,'অ্যাপ্রুভড ($1)'],[/^All \((\d+)\)$/,'সব ($1)'],[/^Total Registered: (\d+)$/,'মোট নিবন্ধিত: $1'],[/^(\d+) days?$/,'$1 দিন']];
function T(s){if(LANG!=='bn')return s;var k=s.trim();if(!k)return s;var v=DICT[k];if(v)return s.replace(k,v);for(var i=0;i<RX.length;i++)if(RX[i][0].test(k))return s.replace(k,k.replace(RX[i][0],RX[i][1]));return s;}
var TM=new WeakMap();
function trNode(n){var e=TM.get(n);if(LANG==='bn'){if(e&&n.data===e.t)return;var o=n.data,t=T(o);if(t!==o){TM.set(n,{o:o,t:t});n.data=t;}}else if(e&&n.data===e.t){n.data=e.o;TM.delete(n);}}
function trPh(el){var o=el.dataset.po;if(o==null){o=el.getAttribute('placeholder');el.dataset.po=o;}el.setAttribute('placeholder',LANG==='bn'?T(o):o);}
function trTree(root){var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var t=n.parentNode&&n.parentNode.nodeName;return t==='SCRIPT'||t==='STYLE'?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});var a=[],x;while((x=w.nextNode()))a.push(x);a.forEach(trNode);if(root.querySelectorAll)root.querySelectorAll('[placeholder]').forEach(trPh);}
new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='characterData'){trNode(m.target);}else m.addedNodes.forEach(function(n){if(n.nodeType===3){if(n.parentNode&&n.parentNode.nodeName!=='SCRIPT')trNode(n);}else if(n.nodeType===1&&n.nodeName!=='SCRIPT')trTree(n);});});}).observe(document.body,{childList:true,subtree:true,characterData:true});
function applyLang(){document.documentElement.lang=LANG;document.querySelectorAll('.langtxt').forEach(function(e){e.textContent=LANG==='bn'?'EN':'বাংলা';});trTree(document.body);}
function toggleLang(){LANG=LANG==='bn'?'en':'bn';try{localStorage.setItem('scs_leave_lang',LANG);}catch(e){}applyLang();}

state.sort='new';state.recView='list';state.historyFilter='All';state.admFilter='Pending';state.approverTab='applications';state.adminLen=4;
function setSort(v){state.sort=v;renderAll();}
function sortApps(list){var idx={};state.applications.forEach(function(a,i){idx[a.applicationId]=i;});var nm=function(a){return a.employeeName||'';};
  return list.slice().sort(function(a,b){var ia=idx[a.applicationId],ib=idx[b.applicationId];
    if(state.sort==='old')return ia-ib;if(state.sort==='az')return nm(a).localeCompare(nm(b))||ib-ia;if(state.sort==='za')return nm(b).localeCompare(nm(a))||ib-ia;if(state.sort==='days')return (b.totalDays-a.totalDays)||ib-ia;return ib-ia;});}
function syncSortSel(){document.querySelectorAll('.sortsel').forEach(function(s){s.value=state.sort;});}
function apNames(a){return String(a.approvedBy||'').split(',').map(function(x){return x.trim();}).filter(Boolean);}
function csv(v){return String(v||'').split(',').map(function(x){return x.trim();}).filter(Boolean);}
function allowedApprovers(a){var e=state.employees.find(function(x){return x.employeeId===a.employeeId;});var l=csv(e&&e.approvedBy||state.globalConfig.approvers);apNames(a).forEach(function(n){if(l.indexOf(n)<0)l.push(n);});return l;}
employeeSummary=function(emp){var apps=state.applications.filter(function(a){return a.employeeId===emp.employeeId;});var taken=0,pend=0;apps.forEach(function(a){if(a.status==='Approved')taken+=Number(a.totalDays||0);else pend+=Number(a.totalDays||0);});var q=Number(emp.acceptableLeaveDays||12);return{apps:apps,taken:taken,pending:pend,quota:q,remaining:Math.max(0,q-taken),extra:Math.max(0,taken-q)};};
function exTd(n){return n>0?'<td class="ex">+'+n+'</td>':'<td>0</td>';}
function summaryHtml(print){var rows=state.employees.map(function(emp){var s=employeeSummary(emp);return '<tr><td><div style="display:flex;align-items:center;gap:6px">'+avatarHtml(emp,'sm')+'<div><b>'+h(emp.name)+'</b><div style="color:var(--mu)">'+h(emp.employeeId)+'</div></div></div></td><td>'+h(emp.designation)+'</td><td>'+s.quota+'</td><td style="color:#059669;font-weight:700">'+s.taken+'</td><td style="color:#0284c7;font-weight:700">'+s.remaining+'</td>'+exTd(s.extra)+'<td>'+s.pending+'</td>'+(print?'<td><button class="btn g" data-id="'+h(emp.employeeId)+'" onclick="printSummaryPerson(this.dataset.id)">Print</button></td>':'')+'</tr>';}).join('');
  return '<div class="table-wrap"><table><tr><th>Employee</th><th>Designation</th><th>Allocated</th><th>Taken</th><th>Remaining</th><th>Extra Leave</th><th>Pending Days</th>'+(print?'<th></th>':'')+'</tr>'+rows+'</table></div>';}

applicationCard=function(app,mode){var emp=state.employees.find(function(e){return e.employeeId===app.employeeId;});
  var av=emp?avatarHtml(emp,'sm'):'<div class="avatar-sm">'+h((app.employeeName||'E').slice(0,1).toUpperCase())+'</div>';var id=h(app.applicationId),ap=apNames(app),ok=app.status==='Approved';
  var act='<button class="btn b" style="padding:2px 8px" data-id="'+id+'" onclick="printApplication(this.dataset.id)" title="Print">&#128424;</button>';
  var apr;
  if(mode==='admin'){act+=' <button class="btn p" data-id="'+id+'" onclick="openAppEdit(this.dataset.id)">Modify</button> <button class="btn r" data-id="'+id+'" onclick="deleteApplication(this.dataset.id)">Delete</button>';
    apr='<div class="aprow"><span class="label" style="display:inline;margin:0">Approve by:</span>'+allowedApprovers(app).map(function(n){var on=ap.indexOf(n)>-1;return '<button class="ap'+(on?' on':'')+'" data-id="'+id+'" data-name="'+h(n)+'" data-on="'+(on?1:0)+'" onclick="toggleApprover(this)">'+(on?'✓ ':'+ ')+h(n)+'</button>';}).join('')+(ap.length?'<button class="btn o" data-id="'+id+'" onclick="unapproveApplication(this.dataset.id)">Unapprove all</button>':'')+'</div>';}
  else apr='<div style="color:#166534">Approved By: '+h(ap.join(', ')||'-')+'</div>';
  return '<div class="rowcard"><div class="rowhead"><div style="display:flex;gap:8px">'+av+'<div><div><b>'+h(app.employeeId)+' - '+h(app.employeeName)+'</b></div><div style="color:var(--mu)">LA ID: '+id+'</div></div></div><div><span class="chip" style="background:'+(ok?'#059669':'#f59e0b')+'">'+h(app.status)+'</span> '+act+'</div></div><div>Designation: '+h(app.designation)+' | Mobile: '+h(app.mobile)+'</div><div>From: '+h(app.fromDate)+' | To: '+h(app.toDate)+'</div><div>Total Days: '+h(app.totalDays)+' | Type: '+h(app.leaveType)+'</div><div>Description: '+h(app.description||'N/A')+'</div>'+apr+'</div>';};
function toggleApprover(b){var id=b.dataset.id,name=b.dataset.name,on=b.dataset.on==='1',a=state.applications.find(function(x){return x.applicationId===id;});if(!a)return;var cur=apNames(a);if(on)cur=cur.filter(function(x){return x!==name;});else if(cur.indexOf(name)<0)cur.push(name);a.approvedBy=cur.join(', ');a.status=cur.length?'Approved':'Pending';renderAll();
  callServer(on?'unapproveApplication':'approveApplication',[id,name]).then(function(r){if(r&&r.ok)updateStateFromServer(r);else{showToast((r&&r.error)||'Failed');loadData();}}).catch(function(){showToast('Failed');loadData();});}
unapproveApplication=function(id){var a=state.applications.find(function(x){return x.applicationId===id;});if(a){a.approvedBy='';a.status='Pending';renderAll();}
  callServer('unapproveApplication',[id,'']).then(function(r){if(r&&r.ok)updateStateFromServer(r);else loadData();}).catch(function(){loadData();});};
approveApplication=function(id,name){var a=state.applications.find(function(x){return x.applicationId===id;});if(a){var c=apNames(a);if(name&&c.indexOf(name)<0)c.push(name);a.approvedBy=c.join(', ');a.status='Approved';renderAll();}
  callServer('approveApplication',[id,name||'']).then(function(r){if(r&&r.ok)updateStateFromServer(r);else loadData();}).catch(function(){loadData();});};

function bkYears(){var y={},c=new Date().getFullYear();y[c]=1;state.applications.forEach(function(a){var x=String(a.fromDate||a.timestamp||'').slice(0,4);if(/^\d{4}$/.test(x))y[x]=1;});return Object.keys(y).sort().reverse();}
function bkScopeText(s){return s==='all'?L('লাইফটাইম (সম্পূর্ণ)','Lifetime (full)'):s==='year'?L('বছরভিত্তিক','Yearly'):s==='month'?L('মাসভিত্তিক','Monthly'):L('নির্দিষ্ট সময়','Custom date range');}
function bkCounts(c){c=c||{};return L('কর্মী ','Employees ')+(c.employees||0)+' · '+L('আবেদন ','Applications ')+(c.applications||0)+' · '+L('নোটিফিকেশন ','Notifications ')+(c.notifications||0)+(c.signatures?' · '+L('সিগনেচার ','Signatures ')+c.signatures:'');}
function bkFmtT(iso){if(!iso)return '—';var d=new Date(iso);return isNaN(d.getTime())?String(iso):d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function bkKb(n){n=Number(n)||0;return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}

/* ---- render ---- */
function renderBackup(){var M=document.getElementById('managerBk');if(!M)return;
  var seg=function(v,t){return '<button type="button" class="'+(BK.scope===v?'on':'')+'" onclick="bkSetScope(\''+v+'\')">'+t+'</button>';};
  var sel='';
  if(BK.scope==='year')sel='<select class="field" onchange="BK.year=this.value">'+bkYears().map(function(y){return '<option'+(y===BK.year?' selected':'')+'>'+y+'</option>';}).join('')+'</select>';
  if(BK.scope==='month')sel='<input type="month" class="field" value="'+h(BK.month)+'" onchange="BK.month=this.value">';
  if(BK.scope==='range')sel='<input type="date" class="field" value="'+h(BK.from)+'" onchange="BK.from=this.value"><span>–</span><input type="date" class="field" value="'+h(BK.to)+'" onchange="BK.to=this.value">';
  var desc=BK.scope==='all'?L('সব কর্মী, সব আবেদন, নোটিফিকেশন, সিগনেচার + সব সেটিংস (অ্যাডমিন PIN, লোগো, লিভ টাইপ, অ্যাপ্রুভার, ইমেইল, অটো ব্যাকআপ কনফিগ)।','All employees, applications, notifications, signatures + all settings (admin PIN, logo, leave types, approvers, email, auto backup config).'):
    BK.scope==='year'?L('ঐ বছরের সব আবেদন ও নোটিফিকেশন + কর্মী তালিকা।','All applications and notifications of that year + the employee list.'):
    BK.scope==='month'?L('শুধু ঐ মাসের আবেদন ও নোটিফিকেশন + কর্মী তালিকা।','Applications and notifications of that month only + the employee list.'):
    L('নির্দিষ্ট তারিখের মধ্যে পড়া আবেদন ও নোটিফিকেশন + কর্মী তালিকা।','Applications and notifications within the chosen dates + the employee list.');
  var rf=BK.rf,sum='';
  if(rf){sum='<div class="bk-sum">📄 '+h(rf.fileName)+'<br>'+L('ধরন: ','Type: ')+bkScopeText(rf.scope)+(rf.from?' ('+h(rf.from)+' → '+h(rf.to)+')':'')+'<br>'+L('এক্সপোর্টের সময়: ','Exported: ')+h(rf.exportedAtLocal||bkFmtT(rf.exportedAt))+'<br>'+bkCounts(rf.counts)+'<br>'+L('সেটিংস: ','Settings: ')+(rf.settings?L('আছে','included'):L('নেই','not included'))+'</div>';}
  M.innerHTML='<div class="panel"><div class="bk-h">'+L('ডাটা ব্যাকআপ, রিস্টোর ও রিসেট (JSON)','Data Backup, Restore & Reset (JSON)')+'</div><p class="bk-sub">'+L('অ্যাপের সব ডাটা ও সেটিংস JSON ফাইলে ব্যাকআপ রাখুন। কিছু হারালে এই ফাইল থেকে আবার ফিরিয়ে আনা যাবে। প্রতিটি কাজে অ্যাডমিন PIN লাগবে।','Keep a JSON backup of all app data and settings. If anything is lost you can bring it back from this file. Every action needs the admin PIN.')+'</p>'+
  '<div class="bk-box"><b>'+L('১) ব্যাকআপ (ডাউনলোড)','1) Backup (download)')+'</b><div class="bk-seg">'+seg('all',L('সম্পূর্ণ লাইফটাইম','Lifetime (everything)'))+seg('year',L('বছরভিত্তিক','Yearly'))+seg('month',L('মাসভিত্তিক','Monthly'))+seg('range',L('নির্দিষ্ট সময়','Custom dates'))+'</div>'+
  (sel?'<div class="bk-row">'+sel+'</div>':'')+'<div class="bk-note">'+desc+'</div><button class="btn gn" style="padding:8px 16px" onclick="bkExport()">'+L('JSON ব্যাকআপ ডাউনলোড','Download JSON backup')+'</button>'+bkNote(BK.msgE)+'</div>'+
  '<div class="bk-box"><b>'+L('২) রিস্টোর (ফাইল থেকে ফিরিয়ে আনা)','2) Restore (from a file)')+'</b><input type="file" id="bkFile" accept=".json,application/json" onchange="bkOnFile(this)" style="font-size:12px;max-width:100%">'+
  '<div class="bk-note">'+L('অথবা নিচের "অটো ব্যাকআপ" তালিকা থেকে গুগল ড্রাইভের ফাইল বেছে নিন।','Or pick a Google Drive file from the "Auto backup" list below.')+'</div>'+sum+
  (rf?'<button class="btn o" style="padding:8px 16px" onclick="bkOpenRestore()">⟲ '+L('এই ফাইল থেকে রিস্টোর করুন…','Restore from this file…')+'</button>':'')+bkNote(BK.msgR)+'</div>'+
  '<div class="bk-box bk-danger"><b>'+L('৩) সম্পূর্ণ ডাটাবেজ রিসেট','3) Full database reset')+'</b><div class="bk-note" style="color:inherit">'+L('আগে সম্পূর্ণ লাইফটাইম ব্যাকআপ ফাইল ডাউনলোড করতে হবে। তারপর ৩ ধাপের সতর্কতা ও প্রতি ধাপে অ্যাডমিন PIN। রিসেটের পর ওই ফাইল দিয়ে সব ফেরানো যাবে।','A full lifetime backup must be downloaded first, then 3 warning steps each with the admin PIN. You can bring everything back from that file afterwards.')+'</div><button class="btn r" style="padding:8px 16px" onclick="bkOpenReset()">'+L('সম্পূর্ণ রিসেট শুরু করুন','Start full reset')+'</button></div></div>'+
  '<div class="panel" id="bkAuto">'+bkAutoHtml()+'</div>';
}
function bkSetScope(v){BK.scope=v;BK.msgE=null;renderBackup();}

/* ---- export ---- */
async function bkExport(){BK.msgE=null;BK.msgR=null;var opt={year:BK.year,month:BK.month,from:BK.from,to:BK.to};
  if(BK.scope==='range'&&(!BK.from||!BK.to)){BK.msgE={ok:false,text:L('শুরু ও শেষের তারিখ দিন','Choose the from and to dates')};return renderBackup();}
  var pin=await openPinModal('Admin PIN For Backup');if(!pin)return;
  var r;try{r=await runWithLoader(L('ব্যাকআপ তৈরি হচ্ছে...','Creating backup...'),function(){return callServer('getBackupJson',[BK.scope,opt,pin]);});}catch(e){r={ok:false,error:e&&e.message||String(e)};}
  if(!r||!r.ok){BK.msgE={ok:false,text:(r&&r.error)||'Failed'};return renderBackup();}
  if(BK.scope!=='all'&&!r.counts.applications&&!r.counts.notifications){BK.msgE={ok:false,text:L('এই সময়ে কোনো আবেদন বা নোটিফিকেশন নেই।','There is no application or notification in this period.')};return renderBackup();}
  bkDownload('scs_leave_backup_'+bkLabel(r)+'_'+bkStamp()+'.json',r.json);
  BK.msgE={ok:true,text:'✔ '+L('ব্যাকআপ ডাউনলোড হয়েছে','Backup downloaded')+' ('+bkScopeText(r.scope)+': '+bkCounts(r.counts)+')'};renderBackup();}

/* ---- restore ---- */
function bkParse(txt,name){var o=JSON.parse(txt);if(!o||typeof o!=='object'||Array.isArray(o))throw new Error('JSON object expected');
  if(o.app&&o.app!=='SCS Leave Application')throw new Error('app = '+o.app);if(o.format!=='scs-leave-backup'||!o.data)throw new Error(L('SCS Leave ব্যাকআপ ফাইল নয়','not an SCS Leave backup file'));
  var c=o.counts||{employees:(o.data.employees&&o.data.employees.rows||[]).length,applications:(o.data.applications&&o.data.applications.rows||[]).length,notifications:(o.data.notifications&&o.data.notifications.rows||[]).length};
  return {fileName:name,json:txt,scope:o.scope||'all',from:o.from||'',to:o.to||'',exportedAt:o.exportedAt||'',exportedAtLocal:o.exportedAtLocal||'',counts:c,settings:!!(o.settings&&typeof o.settings==='object')};}
function bkOnFile(inp){var f=inp.files&&inp.files[0];BK.msgR=null;BK.rf=null;if(!f)return renderBackup();var rd=new FileReader();
  rd.onload=function(){try{BK.rf=bkParse(String(rd.result||''),f.name);BK.mode='merge';BK.withSet=BK.rf.settings;BK.withPin=false;}catch(e){BK.msgR={ok:false,text:L('ফাইলটি সঠিক ব্যাকআপ নয়: ','Not a valid backup file: ')+(e&&e.message||'')};}renderBackup();};
  rd.onerror=function(){BK.msgR={ok:false,text:L('ফাইল পড়া যায়নি','Could not read the file')};renderBackup();};rd.readAsText(f);}
async function bkFromDrive(id){var pin=await openPinModal('Admin PIN For Restore');if(!pin)return;var r;
  try{r=await runWithLoader(L('ড্রাইভ থেকে ফাইল আনা হচ্ছে...','Loading file from Drive...'),function(){return callServer('getDriveBackupFile',[id,pin]);});}catch(e){r={ok:false,error:e&&e.message||String(e)};}
  if(!r||!r.ok)return showToast((r&&r.error)||'Failed');
  try{BK.rf=bkParse(r.json,r.name);BK.mode='merge';BK.withSet=BK.rf.settings;BK.withPin=false;BK.msgR=null;}catch(e){BK.msgR={ok:false,text:e.message};}renderBackup();if(BK.rf)bkOpenRestore();}
function bkOpenRestore(){var rf=BK.rf;if(!rf)return;var full=rf.scope==='all';if(!full&&BK.mode==='replace')BK.mode='merge';
  var radio=function(v,title,txt,dis){return '<label class="bk-opt" style="'+(dis?'opacity:.45;cursor:not-allowed':'')+'"><input type="radio" name="bkMode" '+(BK.mode===v?'checked':'')+(dis?' disabled':'')+' onchange="BK.mode=\''+v+'\'"><span><b>'+title+'</b> '+txt+'</span></label>';};
  var m=document.getElementById('bkModal');
  m.innerHTML='<div class="modal-body" style="max-width:520px;max-height:90vh;overflow:auto"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">'+L('ডাটা রিস্টোর','Restore data')+'</b><button class="btn g" onclick="bkClose(\'bkModal\')">✕</button></div>'+
  '<div class="bk-sum">📄 '+h(rf.fileName)+'<br>'+bkScopeText(rf.scope)+(rf.from?' ('+h(rf.from)+' → '+h(rf.to)+')':'')+'<br>'+bkCounts(rf.counts)+'</div>'+
  '<div class="bk-warn" style="font-weight:600">'+L('সতর্কতা: ফাইলের ডাটা বর্তমান ডাটার জায়গায় বসবে। শুরুর আগে বর্তমান সব ডাটার একটি নিরাপত্তা ব্যাকআপ নিজে থেকে ডাউনলোড হবে এবং গুগল ড্রাইভেও একটি কপি রাখা হবে।','Warning: data in the file will replace the current data. A safety backup of all current data downloads first, and a copy is also kept on Google Drive.')+'</div>'+
  radio('merge',L('মার্জ (প্রস্তাবিত):','Merge (recommended):'),L('ফাইলের কর্মী (Employee ID) ও আবেদন (LA ID) বর্তমানগুলোর জায়গায় বসবে বা নতুন যোগ হবে; বাকি সব যেমন আছে থাকবে।','Employees (by Employee ID) and applications (by LA ID) from the file replace the same ones or are added; everything else stays.'),false)+
  radio('replace',L('সম্পূর্ণ প্রতিস্থাপন:','Full replace:'),L('বর্তমান সব ডাটা সরিয়ে শুধু ফাইলের ডাটা থাকবে (শুধু লাইফটাইম ফাইলে)।','Remove all current data so only the file\'s data remains (lifetime files only).'),!full)+
  (rf.settings?'<label class="bk-opt"><input type="checkbox" '+(BK.withSet?'checked':'')+' onchange="BK.withSet=this.checked;bkOpenRestore()"><span>'+L('সেটিংসও ফিরিয়ে আনুন (লোগো, ইমেইল, অটো ব্যাকআপ কনফিগ)','Restore settings too (logo, email, auto backup config)')+'</span></label>'+
    (BK.withSet?'<label class="bk-opt" style="margin-left:22px"><input type="checkbox" '+(BK.withPin?'checked':'')+' onchange="BK.withPin=this.checked"><span>'+L('ফাইলের অ্যাডমিন PIN-ও ফিরিয়ে আনুন (বন্ধ থাকলে বর্তমান PIN থাকবে)','Also restore the admin PIN from the file (off = keep the current PIN)')+'</span></label>':''):'')+
  '<div class="bk-row" style="margin-top:12px;justify-content:flex-end"><button class="btn g" style="padding:8px 16px" onclick="bkClose(\'bkModal\')">'+L('বাতিল','Cancel')+'</button><button class="btn o" style="padding:8px 16px" onclick="bkRestore()">'+L('নিশ্চিত করে রিস্টোর','Confirm & Restore')+'</button></div></div>';
  m.classList.remove('hidden');}
function bkClose(id){document.getElementById(id).classList.add('hidden');}
async function bkRestore(){var rf=BK.rf;if(!rf)return;BK.msgE=null;bkClose('bkModal');var pin=await openPinModal('Admin PIN For Restore');if(!pin){bkOpenRestore();return;}
  var s;try{s=await runWithLoader(L('নিরাপত্তা ব্যাকআপ নেওয়া হচ্ছে...','Taking the safety backup...'),function(){return callServer('getBackupJson',['all',{},pin]);});}catch(e){s={ok:false,error:e&&e.message||String(e)};}
  if(!s||!s.ok){BK.msgR={ok:false,text:L('নিরাপত্তা ব্যাকআপ নেওয়া যায়নি, তাই রিস্টোর থামানো হয়েছে: ','Safety backup failed, restore stopped: ')+((s&&s.error)||'')};return renderBackup();}
  bkDownload('scs_leave_backup_before-restore_'+bkStamp()+'.json',s.json);
  var r;try{r=await runWithLoader(L('ডাটা রিস্টোর হচ্ছে...','Restoring data...'),function(){return callServer('restoreBackupJson',[rf.json,BK.mode,{withSettings:!!(BK.withSet&&rf.settings),withPin:!!BK.withPin},pin]);});}catch(e){r={ok:false,error:e&&e.message||String(e)};}
  if(!r||!r.ok){BK.msgR={ok:false,text:L('রিস্টোর হয়নি: ','Restore failed: ')+((r&&r.error)||'')};return renderBackup();}
  var x=r.restore||{};BK.rf=null;BK.msgR={ok:true,text:'✔ '+L('রিস্টোর সম্পন্ন','Restore complete')+' ('+(BK.mode==='replace'?L('সম্পূর্ণ প্রতিস্থাপন','full replace'):L('মার্জ','merge'))+'): '+bkCounts(x)+(x.settings?' · '+L('সেটিংস ','settings ')+x.settings:'')};
  SIG_OK=false;try{loadSigs(true);}catch(e){}updateStateFromServer(r);showToast(L('রিস্টোর সম্পন্ন','Restore complete'));renderBackup();}

/* ---- reset (lifetime backup + 3 warning steps with admin PIN) ---- */
function bkOpenReset(){BK.rs={step:0,token:'',what:'leave',err:'',ok:''};bkRenderReset();document.getElementById('bkReset').classList.remove('hidden');}
function bkRenderReset(){var R=BK.rs,m=document.getElementById('bkReset'),body='';
  var warns=[L('সতর্কতা ১/৩: রিসেট করলে ','Warning 1/3: Reset will remove ')+(R.what==='all'?L('সব কর্মী, সব লিভ আবেদন, লিভ রেকর্ড, নোটিফিকেশন ও সিগনেচার','all employees, leave applications, the leave record, notifications and signatures'):L('সব লিভ আবেদন, লিভ রেকর্ড ও নোটিফিকেশন','all leave applications, the leave record and notifications'))+L(' অ্যাপ ও শিট থেকে মুছে যাবে।',' from the app and the sheet.'),
    L('সতর্কতা ২/৩: এই কাজটি ফিরিয়ে আনা যাবে না। শুধুমাত্র ডাউনলোড করা ব্যাকআপ ফাইল ও গুগল ড্রাইভের কপি থেকে ফেরানো যাবে।','Warning 2/3: This cannot be undone. Only the downloaded backup file and the Google Drive copy can bring it back.'),
    L('সতর্কতা ৩/৩: এটি শেষ ধাপ। সঠিক অ্যাডমিন PIN দিলেই সম্পূর্ণ রিসেট সঙ্গে সঙ্গে কার্যকর হবে।','Warning 3/3: This is the final step. Entering the correct admin PIN resets immediately.')];
  if(R.step===0){body='<p style="font-size:13px">'+L('রিসেটের আগে সম্পূর্ণ লাইফটাইম ব্যাকআপ ফাইল ডাউনলোড করতে হবে। ডাউনলোড শেষ হলে পরবর্তী ধাপ চালু হবে।','You must download a full lifetime backup file before resetting. The next step unlocks after the download.')+'</p>'+
    '<label class="bk-opt"><input type="radio" name="bkWhat" '+(R.what==='leave'?'checked':'')+' onchange="BK.rs.what=\'leave\'"><span><b>'+L('শুধু লিভ ডাটা:','Leave data only:')+'</b> '+L('আবেদন, লিভ রেকর্ড ও নোটিফিকেশন মুছবে; কর্মী তালিকা ও সিগনেচার থাকবে।','applications, leave record and notifications are removed; employees and signatures stay.')+'</span></label>'+
    '<label class="bk-opt"><input type="radio" name="bkWhat" '+(R.what==='all'?'checked':'')+' onchange="BK.rs.what=\'all\'"><span><b>'+L('সব ডাটা:','All data:')+'</b> '+L('সাথে কর্মী তালিকা ও সিগনেচারও মুছবে।','also removes the employee list and signatures.')+'</span></label>'+
    '<div class="bk-note">'+L('সেটিংস (অ্যাডমিন PIN, লোগো, লিভ টাইপ, অ্যাপ্রুভার, ইমেইল, অটো ব্যাকআপ) সব অবস্থায় থাকবে।','Settings (admin PIN, logo, leave types, approvers, email, auto backup) always stay.')+'</div>'+
    '<button class="btn gn" style="width:100%;padding:10px" onclick="bkResetBackup()">'+L('লাইফটাইম ব্যাকআপ ফাইল ডাউনলোড করুন','Download lifetime backup file')+'</button>'+(R.token?'<div class="bk-ok">✔ '+L('ব্যাকআপ ডাউনলোড হয়েছে','Backup downloaded')+'</div>':'');}
  else body='<div class="bk-warn">'+warns[R.step-1]+'</div><p style="font-size:12px;color:var(--mu)">'+L('পরের ধাপে যেতে অ্যাডমিন PIN দিন','Enter the admin PIN to continue')+' ('+R.step+'/3)</p>';
  var next=R.step===0?'<button class="btn r" style="flex:1;padding:10px'+(R.token?'':';opacity:.4')+'" '+(R.token?'':'disabled')+' onclick="BK.rs.step=1;bkRenderReset()">'+L('পরবর্তী ধাপ','Next')+'</button>':
    '<button class="btn r" style="flex:1;padding:10px" onclick="bkResetConfirm()">'+(R.step<3?L('অ্যাডমিন PIN দিয়ে নিশ্চিত করুন','Confirm with admin PIN'):L('সম্পূর্ণ রিসেট করুন','Reset everything'))+'</button>';
  m.innerHTML='<div class="modal-body" style="max-width:440px;border-color:#fecdd3"><b style="font-size:16px;color:#e11d48">'+L('ব্যাকআপ ও সম্পূর্ণ রিসেট','Backup & Full Reset')+'</b><div style="margin-top:10px">'+body+'</div>'+(R.err?'<div class="bk-err">'+h(R.err)+'</div>':'')+
  '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn g" style="flex:1;padding:10px" onclick="bkClose(\'bkReset\')">'+L('বাতিল','Cancel')+'</button>'+next+'</div></div>';}
async function bkResetBackup(){var R=BK.rs;bkClose('bkReset');var pin=await openPinModal('Admin PIN For Backup');document.getElementById('bkReset').classList.remove('hidden');if(!pin)return;
  var r;try{r=await runWithLoader(L('লাইফটাইম ব্যাকআপ তৈরি হচ্ছে...','Creating lifetime backup...'),function(){return callServer('getBackupJson',['all',{},pin]);});}catch(e){r={ok:false,error:e&&e.message||String(e)};}
  if(!r||!r.ok){R.err=(r&&r.error)||'Failed';return bkRenderReset();}
  bkDownload('scs_leave_backup_lifetime_before-reset_'+bkStamp()+'.json',r.json);R.token=r.resetToken||'';R.err='';bkRenderReset();showToast(L('লাইফটাইম ব্যাকআপ ডাউনলোড হয়েছে','Lifetime backup downloaded'));}
async function bkResetConfirm(){var R=BK.rs;bkClose('bkReset');var pin=await openPinModal('Admin PIN ('+R.step+'/3)');document.getElementById('bkReset').classList.remove('hidden');if(!pin)return;
  if(R.step<3){var v;try{v=await runWithLoader(L('যাচাই হচ্ছে...','Verifying...'),function(){return callServer('verifyAdminPin',[pin]);});}catch(e){v=null;}
    if(!v||!v.ok){R.err=L('ভুল অ্যাডমিন PIN','Wrong admin PIN');return bkRenderReset();}R.err='';R.step++;return bkRenderReset();}
  var r;try{r=await runWithLoader(L('রিসেট হচ্ছে...','Resetting...'),function(){return callServer('resetAllData',[pin,R.token,R.what]);});}catch(e){r={ok:false,error:e&&e.message||String(e)};}
  if(!r||!r.ok){R.err=(r&&r.error)||'Failed';return bkRenderReset();}
  bkClose('bkReset');if(R.what==='all'){SIG={};try{localStorage.removeItem('scs_sigs');}catch(e){}}SIG_OK=false;updateStateFromServer(r);showToast(L('রিসেট সম্পন্ন হয়েছে','Reset completed'));renderBackup();}

/* ---- Google Drive auto backup ---- */
function bkAutoLoad(){callServer('getAutoBackupConfig',[]).then(function(r){BK.ab=r;if(!BK.abDraft||!BK.abDirty)BK.abDraft={enabled:r.enabled,interval:r.interval,keepMode:r.keepMode,keepValue:r.keepValue,onlyChanged:r.onlyChanged,folderId:r.folderId||''};bkAutoRender();}).catch(function(e){BK.abMsg={ok:false,text:e&&e.message||String(e)};bkAutoRender();});}
function bkEditing(el){var a=document.activeElement;return !!(el&&a&&el.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='checkbox'&&a.type!=='radio'&&a.type!=='file');}
function bkAutoRender(force){var el=document.getElementById('bkAuto');if(el&&(force||!bkEditing(el)))el.innerHTML=bkAutoHtml();}
function bkAutoSet(k,v){BK.abDraft[k]=v;BK.abDirty=true;}
function bkAutoHtml(){var a=BK.ab,d=BK.abDraft;var head='<div class="bk-h">'+L('গুগল ড্রাইভে অটো ব্যাকআপ (JSON)','Auto backup to Google Drive (JSON)')+'</div><p class="bk-sub">'+L('নির্দিষ্ট সময় পর পর অ্যাপের সম্পূর্ণ লাইফটাইম ব্যাকআপ নিজে থেকে গুগল ড্রাইভের ফোল্ডারে সেভ হবে। পুরনো ফাইল নিজে থেকে মুছে যাবে।','A full lifetime backup is saved to a Google Drive folder automatically at the chosen interval. Old files are cleaned up automatically.')+'</p>';
  if(!a||!d)return head+'<div class="bk-note">'+L('লোড হচ্ছে...','Loading...')+'</div>'+bkNote(BK.abMsg);
  var ivs=[['1m',L('প্রতি ১ মিনিট','Every 1 minute')],['2m',L('প্রতি ২ মিনিট','Every 2 minutes')],['5m',L('প্রতি ৫ মিনিট','Every 5 minutes')],['15m',L('প্রতি ১৫ মিনিট','Every 15 minutes')],['30m',L('প্রতি ৩০ মিনিট','Every 30 minutes')],['1h',L('প্রতি ঘন্টা','Every hour')],['6h',L('প্রতি ৬ ঘন্টা','Every 6 hours')],['12h',L('প্রতি ১২ ঘন্টা','Every 12 hours')],['1d',L('প্রতিদিন (দৈনিক)','Daily')]];
  var busy=BK.abBusy;
  var files=(a.files||[]).length?'<div class="table-wrap" style="margin-top:10px"><table class="bk-files"><thead><tr><th>'+L('ফাইল','File')+'</th><th>'+L('সময়','Time')+'</th><th>'+L('সাইজ','Size')+'</th><th></th></tr></thead><tbody>'+a.files.map(function(f){return '<tr><td><a href="'+h(f.url)+'" target="_blank" rel="noopener">'+h(f.name)+'</a></td><td style="white-space:nowrap">'+bkFmtT(f.created)+'</td><td style="white-space:nowrap">'+bkKb(f.size)+'</td><td><button class="btn o" data-id="'+h(f.id)+'" onclick="bkFromDrive(this.dataset.id)">'+L('রিস্টোর','Restore')+'</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="bk-note">'+L('এখনো কোনো ব্যাকআপ ফাইল নেই।','No backup files yet.')+'</div>';
  return head+'<div class="bk-grid">'+
  '<div><label class="bk-sw"><input type="checkbox" '+(d.enabled?'checked':'')+' onchange="bkAutoSet(\'enabled\',this.checked)"><span class="bk-tg"></span>'+L('অটো ব্যাকআপ চালু','Auto backup on')+'</label></div>'+
  '<div><label>'+L('কত সময় পর পর','How often')+'</label><select class="field" onchange="bkAutoSet(\'interval\',this.value)">'+ivs.map(function(x){return '<option value="'+x[0]+'"'+(d.interval===x[0]?' selected':'')+'>'+x[1]+'</option>';}).join('')+'</select></div>'+
  '<div><label>'+L('পুরনো ফাইল রাখুন','Keep old files')+'</label><div class="bk-row" style="flex-wrap:nowrap"><input type="number" min="1" max="5000" class="field" style="width:80px" value="'+Number(d.keepValue)+'" onchange="bkAutoSet(\'keepValue\',Number(this.value))"><select class="field" onchange="bkAutoSet(\'keepMode\',this.value)"><option value="days"'+(d.keepMode==='days'?' selected':'')+'>'+L('দিন পর্যন্ত','days')+'</option><option value="count"'+(d.keepMode==='count'?' selected':'')+'>'+L('টি ফাইল','files')+'</option></select></div></div>'+
  '<div><label class="bk-opt" style="height:36px;align-items:center;margin:0"><input type="checkbox" '+(d.onlyChanged?'checked':'')+' onchange="bkAutoSet(\'onlyChanged\',this.checked)"><span>'+L('ডাটা বদলালেই শুধু নতুন ফাইল','New file only when data changed')+'</span></label></div>'+
  '</div><div class="bk-grid" style="margin-top:10px;grid-template-columns:1fr"><div><label>'+L('ড্রাইভ ফোল্ডার আইডি বা লিংক (ঐচ্ছিক — ফাঁকা থাকলে শিট যে ফোল্ডারে আছে সেখানে)','Drive folder ID or link (optional — blank = the folder of the sheet)')+'</label><input class="field" value="'+h(d.folderId)+'" placeholder="https://drive.google.com/drive/folders/..." onchange="bkAutoSet(\'folderId\',this.value)"></div></div>'+
  '<div class="bk-row" style="margin-top:12px"><button class="btn b" style="padding:8px 16px" '+(busy?'disabled':'')+' onclick="bkAutoSave()">'+(busy==='save'?L('সেভ হচ্ছে...','Saving...'):L('সেটিংস সেভ করুন','Save settings'))+'</button><button class="btn gn" style="padding:8px 16px" '+(busy?'disabled':'')+' onclick="bkAutoNow()">'+(busy==='run'?L('ব্যাকআপ হচ্ছে...','Backing up...'):L('এখনই ড্রাইভে ব্যাকআপ','Backup to Drive now'))+'</button><button class="btn g" style="padding:8px 12px" onclick="bkAutoLoad()" title="Refresh">⟳</button></div>'+bkNote(BK.abMsg)+
  '<div class="bk-st"><div>'+L('অবস্থা: ','Status: ')+(a.enabled&&a.triggerOn?'<b style="color:#059669">'+L('চালু','ON')+'</b>':'<b style="color:#e11d48">'+L('বন্ধ','OFF')+'</b>')+(a.enabled&&!a.triggerOn?' — '+L('ট্রিগার সেট হয়নি, "সেটিংস সেভ করুন" চাপুন','trigger not set, press "Save settings"'):'')+'</div>'+
  '<div>'+L('শেষ ব্যাকআপ: ','Last backup: ')+bkFmtT(a.lastRun)+(a.lastFileUrl?' — <a href="'+h(a.lastFileUrl)+'" target="_blank" rel="noopener">'+h(a.lastFile)+'</a>':'')+'</div>'+
  '<div>'+L('শেষ চেক: ','Last check: ')+bkFmtT(a.lastCheck)+'</div>'+
  (a.folderUrl?'<div>'+L('ফোল্ডার: ','Folder: ')+'<a href="'+h(a.folderUrl)+'" target="_blank" rel="noopener">'+h(a.folderName)+'</a></div>':'')+
  (a.lastError?'<div style="color:#e11d48">'+L('সমস্যা: ','Error: ')+h(a.lastError)+'</div>':'')+'</div>'+files;}
async function bkAutoSave(){var pin=await openPinModal('Admin PIN For Save');if(!pin)return;BK.abBusy='save';BK.abMsg=null;bkAutoRender(1);var r;
  try{r=await callServer('saveAutoBackupConfig',[BK.abDraft,pin]);}catch(e){r={ok:false,error:e&&e.message||String(e)};}BK.abBusy='';
  if(!r||!r.ok){BK.abMsg={ok:false,text:(r&&r.error)||'Failed'};return bkAutoRender();}BK.ab=r;BK.abDirty=false;BK.abDraft={enabled:r.enabled,interval:r.interval,keepMode:r.keepMode,keepValue:r.keepValue,onlyChanged:r.onlyChanged,folderId:r.folderId||''};BK.abMsg={ok:true,text:'✔ '+L('অটো ব্যাকআপ সেটিংস সেভ হয়েছে','Auto backup settings saved')};bkAutoRender();}
async function bkAutoNow(){var pin=await openPinModal('Admin PIN For Backup');if(!pin)return;BK.abBusy='run';BK.abMsg=null;bkAutoRender(1);var r;
  try{r=await callServer('runAutoBackupNow',[pin]);}catch(e){r={ok:false,error:e&&e.message||String(e)};}BK.abBusy='';
  if(!r||!r.ok){BK.abMsg={ok:false,text:L('ব্যাকআপ হয়নি: ','Backup failed: ')+((r&&r.error)||'')};return bkAutoRender();}BK.ab=r;BK.abMsg={ok:true,text:'✔ '+L('ব্যাকআপ গুগল ড্রাইভে সেভ হয়েছে','Backup saved to Google Drive')+(r.run&&r.run.file?': '+r.run.file.name:'')};bkAutoRender();}

var _rap8=renderApprover;renderApprover=function(){_rap8();var t=state.approverTab,M=document.getElementById('managerBk');M.classList.toggle('hidden',t!=='backup');
  if(t==='backup'){if(!M.innerHTML||!bkEditing(M))renderBackup();if(!BK.ab&&!BK.abLoading){BK.abLoading=true;bkAutoLoad();}}};
renderAll();

    </script>
