  window.addEventListener('beforeprint', function () { if (!S.showAll && S.role) { S.showAll = true; render(); } });
  window.addEventListener('afterprint', afterPrint);
  document.body.insertAdjacentHTML('beforeend', '<div id="modal"></div><div id="toast"></div>');
  document.addEventListener('click', onClick); document.addEventListener('change', onChange); document.addEventListener('input', onInput);
  document.addEventListener('error', function (e) { var t = e.target; if (t && t.tagName === 'IMG' && t.getAttribute('data-logo') && !t.getAttribute('data-fb')) { var lm = (t.src || '').match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/); if (lm && !t.getAttribute('data-fb0')) { t.setAttribute('data-fb0', '1'); t.src = 'https://drive.google.com/thumbnail?id=' + lm[1] + '&sz=w256'; return; } t.setAttribute('data-fb', '1'); t.src = LOGO; } }, true);
  document.addEventListener('submit', function (e) { if (e.target.id === 'mf') { e.preventDefault(); submitForm(e.target); } else if (e.target.id === 'mvf') { e.preventDefault(); moveSubmit(e.target); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('#modal').innerHTML) { if ($('#mf')) return; if (S.histOpen && !$('#hmall')) histModal(); else closeModal(); return; }
      if (S.focus) { S.focus = false; S.fsPin = ''; render(); return; }
    }
    if (!S.role && !$('#modal').innerHTML) { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') { S.pin = S.pin.slice(0, -1); render(); } else if (e.key === 'Enter') tryLogin(true); }
  });
  if (S.role) { try { var cd = sessionStorage.getItem('scs_col_cache'); if (cd) applyData(JSON.parse(cd)); } catch (e) {} S.loading = !D.bills.length && !D.chems.length; }
  render();
  if (S.role) load(true);
  refreshLens();
  setInterval(poll, 10000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) poll(); });
  window.addEventListener('focus', poll);
}
