<!-- ============ আসল অ্যাপ (Apps Script Index.html) ============ -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base target="_top">
<script>var APP_NAME_SRV = "SCS Workspace";</script>
<title>SCS Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#e5007d; --pink-d:#c4006b; --pink-50:#fdf2f8; --pink-100:#fce7f3; --pink-200:#fbcfe8;
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8; --line:#e2e8f0; --soft:#f8fafc;
  --ok:#059669; --warn:#d97706; --err:#e11d48; --blue:#2563eb;
  --shadow:0 10px 30px rgba(15,23,42,.10);
  --r:14px;
}
body.dark{
  --bg:#0b1220; --card:#111a2e; --ink:#e2e8f0; --ink2:#94a3b8; --ink3:#64748b; --line:#1f2a44; --soft:#0f172a;
  --pink-50:#2a0f20; --pink-100:#3a1228; --pink-200:#5b1a40; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;max-width:100%}
body{font-family:Inter,'Hind Siliguri',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- top bar ---------- */
.top{background:var(--pink);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:10px;background:#fff;color:#0f172a;border-radius:14px;padding:6px 14px 6px 8px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:0}
.brand img{width:34px;height:34px;flex:none}
.brand b{font-size:16px;white-space:nowrap}
.tag{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.tag b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag i{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.tbtn{height:36px;min-width:36px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.26)}
.tbtn.out{background:rgba(190,0,95,.85)}
.savestate{font-size:12px;opacity:.95;display:flex;align-items:center;gap:6px;white-space:nowrap}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:#a7f3d0}
.savestate.dirty .dot{background:#fde68a}
.savestate.err .dot{background:#fecaca}

/* ---------- nav ---------- */
.nav{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:58px;z-index:50}
.nav::-webkit-scrollbar{display:none}
.pill{height:38px;padding:0 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 4px 12px rgba(229,0,125,.3)}
.pill:not(.on):hover{border-color:var(--pink-200);background:var(--pink-50)}

/* ---------- login ---------- */
#login{min-height:calc(100vh - 58px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:16px}
.lcard{width:100%;max-width:380px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:30px 32px;text-align:center}
.lock{width:56px;height:56px;border-radius:16px;background:var(--pink-100);border:1px solid var(--pink-200);color:var(--pink);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.lock svg{width:26px;height:26px}
.lcard h2{font-size:19px;font-weight:700}
.lcard p{color:var(--ink3);font-size:12px;margin-top:6px}
.dots{display:flex;gap:14px;justify-content:center;margin:26px 0 22px;min-height:14px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line);transition:.15s}
.dots i.f{background:var(--pink);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:56px;border-radius:16px;background:var(--soft);font-size:20px;font-weight:700;color:var(--ink)}
.pad button:active{background:var(--pink-100)}
.pad button.sm{font-size:12px;color:var(--ink2);font-weight:700;letter-spacing:.02em}
.go{width:100%;height:52px;margin-top:16px;border-radius:16px;background:var(--pink);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(229,0,125,.28)}
.go:disabled{opacity:.45;box-shadow:none}
.lerr{color:var(--err);font-size:12px;min-height:16px;margin-top:10px}
.lfoot{color:var(--ink3);font-size:12px;display:flex;align-items:center;gap:6px}
.copy{color:var(--ink3);font-size:12px;text-align:center;padding:16px}

/* ---------- generic ui ---------- */
.btn{height:38px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px;white-space:nowrap;flex:none}
.btn:hover{border-color:var(--pink-200);background:var(--pink-50)}
.btn.pk{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.pk:hover{background:var(--pink-d)}
.btn.dn{color:var(--err)}
.btn.dn:hover{background:#fff1f2;border-color:#fecdd3}
.btn.sm{height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.ic{width:38px;padding:0}
.btn.sm.ic{width:32px}
.btn.on{background:var(--pink-100);border-color:var(--pink);color:var(--pink)}
.btn:disabled{opacity:.4;pointer-events:none}
.inp{height:38px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);width:100%;min-width:0}
.inp:focus,.btn:focus-visible{outline:2px solid var(--pink-200);border-color:var(--pink)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.lab{display:block;font-size:11px;font-weight:700;color:var(--ink2);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.inp{flex:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px rgba(15,23,42,.06);border:1px solid var(--line);padding:16px}
.h1{font-size:22px;font-weight:700}
.muted{color:var(--ink3);font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px}
.badge.d{background:#fef3c7;color:#92400e}
.badge.f{background:#d1fae5;color:#065f46}

/* ---------- builder layout ---------- */
#app{display:flex;flex-direction:column;min-height:calc(100vh - 110px)}
.view{display:none}
.view.on{display:block}
#vBuilder.on{display:flex;flex-direction:column;height:calc(100vh - 110px);height:calc(100dvh - 110px)}
.tools{background:var(--card);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:thin;flex:none}
.tools .sep{width:1px;height:24px;background:var(--line);flex:none}
.work{flex:1;display:flex;min-height:0;position:relative}
.stage{flex:1;overflow:auto;background:#cbd5e1;padding:18px 0 90px;position:relative;-webkit-overflow-scrolling:touch}
body.dark .stage{background:#060b16}
.sizer{margin:0 auto;position:relative}
.pages{transform-origin:0 0;width:var(--pw,794px);position:absolute;left:0;top:0}
.page{position:relative;width:var(--pw,794px);height:var(--ph,1122px);background:#fff;margin:0 0 24px;box-shadow:0 6px 24px rgba(15,23,42,.25);overflow:hidden;flex:none}
.page .padimg{position:absolute;left:0;top:0;width:var(--pw,794px);height:var(--ph,1122px);pointer-events:none;user-select:none;-webkit-user-drag:none}
.page .pno{position:absolute;right:10px;top:4px;font:11px Arial;color:#94a3b8;z-index:3}
.guide{position:absolute;left:0;right:0;border-top:1px dashed rgba(229,0,125,.55);pointer-events:none;z-index:1}
.guide.v{top:0;bottom:0;left:auto;right:auto;border-top:0;border-left:1px dashed rgba(229,0,125,.35)}
.guide span{position:absolute;right:6px;top:-14px;font:9px Arial;color:rgba(229,0,125,.8);background:#fff;padding:0 3px}
.dead{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,rgba(229,0,125,.05) 0 6px,transparent 6px 12px);pointer-events:none;z-index:1}

/* ---------- elements ---------- */
.el{position:absolute;font-family:Arial,'Hind Siliguri',Helvetica,sans-serif;color:#111;font-size:13px;line-height:1.4;z-index:5;touch-action:manipulation}
.el.ro{pointer-events:auto}
.el .grip,.el .rh,.el .rb,.el .elbar{display:none}
.el.sel{outline:1.5px solid var(--pink);outline-offset:2px}
.el.sel .grip{display:flex}
.el.sel .rh,.el.sel .rb{display:block}
.el.sel .elbar{display:flex}
.grip{position:absolute;left:-14px;top:-30px;width:30px;height:28px;border-radius:9px;background:var(--pink);color:#fff;align-items:center;justify-content:center;cursor:grab;touch-action:none;z-index:30;box-shadow:0 3px 8px rgba(0,0,0,.25);user-select:none}
.grip svg{width:16px;height:16px}
.elbar{position:absolute;left:20px;top:-30px;height:28px;gap:4px;z-index:30;align-items:center}
.elbar button{height:28px;min-width:28px;padding:0 6px;border-radius:9px;background:#fff;border:1px solid var(--pink-200);color:var(--pink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.15);font-size:11px;font-weight:700}
.elbar button svg{width:14px;height:14px}
.rh{position:absolute;right:-9px;top:50%;margin-top:-16px;width:14px;height:32px;border-radius:7px;background:var(--pink);cursor:ew-resize;touch-action:none;z-index:30;border:2px solid #fff}
.rb{position:absolute;right:-10px;bottom:-10px;width:18px;height:18px;border-radius:50%;background:var(--pink);cursor:nwse-resize;touch-action:none;z-index:30;border:2px solid #fff}
@media (pointer:coarse){.grip{width:38px;height:36px;left:-16px;top:-40px}.elbar{top:-40px;left:28px}.elbar button{height:36px;min-width:36px}.rh{width:20px;height:44px;right:-12px;margin-top:-22px}.rb{width:26px;height:26px;right:-13px;bottom:-13px}}

.el [contenteditable=true]{outline:none;cursor:text;min-width:8px}
.el [contenteditable=true]:hover{background:rgba(229,0,125,.05)}
.el [contenteditable=true]:focus{background:rgba(229,0,125,.09);box-shadow:0 0 0 1px rgba(229,0,125,.4)}
.hdr .hr{display:flex;justify-content:space-between;gap:16px;margin-bottom:3px;align-items:baseline}
.hdr .hr>div{min-width:0}
.hdr .hr>div.r{text-align:right}
.hdr .fl{position:relative;padding-right:0}
.hdr .fl b{font-weight:700}
.hdr .fx{display:none;position:absolute;right:-18px;top:0;width:15px;height:15px;border-radius:50%;background:#fecdd3;color:#be123c;font:700 11px/15px Arial;text-align:center;cursor:pointer;user-select:none}
.el.sel .hdr .fx{display:block}
.hdr .qno{font-weight:700;color:#111}
.txt{white-space:pre-wrap;word-break:break-word}
.tt{font-weight:700;margin-bottom:3px;font-size:1em}
.terms ol,.terms ul{padding-left:20px}
.terms li{margin-bottom:2px;padding-left:2px}
.terms ol.alpha{list-style:lower-alpha}
.inw{border:1px solid #111;padding:6px 10px;font-weight:700;border-radius:2px}
.inw .lk{display:none}
.sigs{display:flex;gap:26px;align-items:flex-end}
.sigs .sg{flex:1;text-align:center;min-width:0}
.sigs .sp{height:56px;display:flex;align-items:flex-end;justify-content:center}
.sigs .sp img{max-height:54px;max-width:100%}
.sigs .ln{border-top:1px solid #111;margin-top:2px;padding-top:4px;font-weight:700}
.sigs .ds{font-size:.92em}
.seal img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
.seal .ph{width:100%;height:100%;border:2px dashed #be185d;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#be185d;font:700 11px Arial;text-align:center;background:rgba(255,255,255,.6)}
.tbl{position:relative}
.tbl table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:inherit}
.tbl td{-webkit-user-select:none;user-select:none;border:1px solid #111;padding:3px 6px;vertical-align:middle;word-break:break-word;overflow-wrap:anywhere;position:relative;height:1px}
.tbl.nb td{border-color:transparent}
.tbl td.hd{font-weight:700;background:#f1f5f9}
.tbl td.csel{background:rgba(229,0,125,.14)!important;box-shadow:inset 0 0 0 1.5px var(--pink)}
.tbl td.anch{box-shadow:inset 0 0 0 2px var(--pink)}
.tbl td.ed{outline:2px solid var(--blue);outline-offset:-2px;background:#fff!important;cursor:text;-webkit-user-select:text;user-select:text}
.tbl td.err{color:#b91c1c}
.tbl.pick td{cursor:crosshair}
.tbl.pick td:hover{background:rgba(5,150,105,.25)!important}
.chdr,.rlab{display:none;position:absolute;font:700 9px Arial;color:#64748b;background:#e2e8f0;text-align:center;line-height:14px;z-index:20;pointer-events:none}
.chdr{top:-15px;height:14px}
.rlab{left:-18px;width:16px}
.cgrip{position:absolute;top:0;bottom:0;width:11px;margin-left:-5px;cursor:col-resize;z-index:25;touch-action:none;display:none}
.rgrip{position:absolute;left:-22px;width:22px;height:11px;margin-top:-5px;cursor:row-resize;z-index:25;touch-action:none;display:none}
.el.sel .cgrip,.el.sel .rgrip,.el.sel .chdr,.el.sel .rlab{display:block}
.cgrip:hover,.rgrip:hover{background:rgba(229,0,125,.35)}

/* print + export mode */
body.exporting .grip,body.exporting .rh,body.exporting .rb,body.exporting .elbar,body.exporting .guide,body.exporting .dead,body.exporting .pno,body.exporting .chdr,body.exporting .rlab,body.exporting .cgrip,body.exporting .rgrip,body.exporting .fx{display:none!important}
body.exporting .el.sel{outline:none}
body.exporting .tbl td.csel,body.exporting .tbl td.anch{background:none!important;box-shadow:none}
body.exporting .tbl td.hd{background:#f1f5f9!important}
body.exporting .el [contenteditable=true]:hover,body.exporting .el [contenteditable=true]:focus{background:none;box-shadow:none}
body.exporting .page{box-shadow:none;margin:0}
body.exporting .stage{background:#fff;padding:0}

/* ---------- properties panel ---------- */
.props{width:320px;flex:none;background:var(--card);border-left:1px solid var(--line);overflow:auto;padding:12px 14px 90px;-webkit-overflow-scrolling:touch}
.props h3{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.props .grp{border-bottom:1px solid var(--line);padding:6px 0 10px}
.props .grp:last-child{border:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sheetbar{display:none}
.fab{display:none}
.hint{background:var(--pink-50);border:1px solid var(--pink-200);color:#9d174d;border-radius:12px;padding:8px 10px;font-size:12px;line-height:1.4;margin-top:8px}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#059669;color:#fff;border-radius:12px;padding:8px 14px;font-weight:600;z-index:40;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;max-width:92%}
.zoombar{position:absolute;right:12px;bottom:14px;display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);z-index:35;align-items:center}
.zoombar span{font-size:12px;font-weight:700;min-width:42px;text-align:center}
.pagebar{position:absolute;left:12px;bottom:14px;display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:var(--shadow);z-index:35;align-items:center}
.pagebar span{font-size:12px;font-weight:700;padding:0 6px}

/* mobile layout */
@media (max-width:900px){
  .props{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:58vh;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);z-index:70;transform:translateY(calc(100% - 0px));transition:transform .22s;padding-bottom:40px}
  .props.open{transform:none}
  .props .pull{display:block}
  .fab{display:flex;position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--pink);color:#fff;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(229,0,125,.4);z-index:65}
  .fab svg{width:24px;height:24px}
  .tag{display:none}
  .brand b{font-size:14px}
  .savestate span.t{display:none}
  .zoombar{bottom:76px}.pagebar{bottom:76px}
}
.props .pull{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}

/* ---------- archive ---------- */
.wrap{max-width:1150px;margin:0 auto;padding:16px}
.filters{display:grid;grid-template-columns:2fr 1.3fr 1fr 1fr auto;gap:8px;margin:12px 0}
@media (max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters .inp:first-child{grid-column:1/3}}
table.list{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden}
table.list th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--ink2);padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.list tr:hover td{background:var(--pink-50)}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.qcards{display:none}
@media (max-width:760px){
  table.list{display:none}
  .qcards{display:grid;gap:10px}
  .qc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .qc .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .qc .acts{justify-content:flex-start;margin-top:10px}
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:20px;margin-top:4px}

/* ---------- modal / toast ---------- */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:20px}
.modal.wide{max-width:760px}
.modal h3{font-size:17px;font-weight:700;margin-bottom:4px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:14px;z-index:200;font-weight:600;box-shadow:var(--shadow);max-width:92vw;display:flex;gap:8px;align-items:center}
.toast.ok{background:#065f46}.toast.er{background:#9f1239}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.75);z-index:150;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-weight:600;color:#0f172a}

function applyHeaderTo(doc, hd, name) {
  var hdr = doc.els.filter(function (e) { return e.type === 'header'; })[0]; if (!hdr) return;
  var last = (hd && hd.last) || [], sv = (hd && hd.saved) || {}, skip = { qno: 1, date: 1 };
  hdr.fields.forEach(function (f) {
    if (skip[f.k]) return;
    if (sv[f.k]) { f.v = sv[f.k]; return; }
    var m = last.filter(function (x) { return x.k === f.k; })[0]; if (m) f.v = m.v;
  });
  last.forEach(function (x) { if (!skip[x.k] && !hdr.fields.some(function (f) { return f.k === x.k; })) hdr.fields.push({ id: uid('f'), k: x.k, l: x.l, v: sv[x.k] || x.v, s: x.s || 'f', b: x.b ? 1 : 0 }); });
  hdr.fields.forEach(function (f) { if (f.k === 'client' && (!f.v || /Client Company Name/i.test(f.v))) f.v = name; });
}

/* ---- tables: standard / blank / saved templates ---- */
function mkBlankTable(doc, w, nr, nc) {
  nr = clamp(nr, 1, 500); nc = clamp(nc, 1, 30);
  var cw = Math.floor(w / nc), cols = []; for (var c = 0; c < nc; c++) cols.push(cw); cols[nc - 1] += w - cw * nc;
  var rows = []; for (var r = 0; r < nr; r++) { var cells = []; for (var k = 0; k < nc; k++) cells.push(mkCell('', { a: 'l' })); rows.push({ h: 28, cells: cells }); }
  return { id: uid('e'), type: 'table', x: doc.m.s, y: 0, w: w, z: 2, fs: 12, t: { cols: cols, rows: rows, hr: 0, dec: S.cfg.dec === 0 ? 0 : 2, nb: 0 } };
}
function tableFromTpl(doc, w, tpl) {
  var T = clone(tpl.t); T.rows.forEach(function (r) { r.cells.forEach(function (c) { c.id = uid('c'); }); });
  var sum = T.cols.reduce(function (a, b) { return a + b; }, 0) || w, f = w / sum, tot = 0;
  T.cols = T.cols.map(function (x) { var v = Math.max(20, Math.round(x * f)); tot += v; return v; }); T.cols[T.cols.length - 1] += w - tot;
  return { id: uid('e'), type: 'table', x: doc.m.s, y: 0, w: w, z: 2, fs: tpl.fs || 12, t: T };
}

    if (a === 'here') {
      if (!at.co) return; m.close();
      var used = extra[at.co] || Object.keys(extra).some(function (k) { return k.indexOf(at.co + '|') === 0; });
      if (used) { var c = regOf(at.co); if (!c) { c = { name: at.co, projects: [] }; S.reg.push(c); } Object.keys(extra).forEach(function (k) { if (k.indexOf(at.co + '|') === 0) c.projects.push(k.slice(at.co.length + 1)); }); saveReg(); }
      cb(at.co, at.pj || ''); return;
    }
    if (a === 'newf') {
      wsNameModal(L('New folder here', 'এখানে নতুন ফোল্ডার'), L('Folder name', 'ফোল্ডারের নাম'), '', function (name) {
        if (!at.co) { extra[name] = 1; at.co = name; at.pj = ''; }
        else { var p = at.pj ? at.pj + ' / ' + name : name; extra[at.co + '|' + p] = 1; at.pj = p; }
        draw();
      });
      return;
    }
    var k = a.slice(0, 2), v = a.slice(2);
    if (k === 'o:') { at.co = v; at.pj = ''; }
    else if (k === 's:') at.pj = v;
    else if (k === 'c:') { var i = Number(v); if (i < 0) { at.co = null; at.pj = ''; } else at.pj = wsSplit(at.pj).slice(0, i).join(' / '); }
    draw();
  });
};

</script>
