/* zero page margin = the browser cannot add its own header/footer (date, link, page no) on every page;

/* ---------- হিসাব (আগের Worker App-এর লজিক, অপরিবর্তিত) ---------- */
const activeOn=(w,d)=>{const h=w.hist||[];if(!h.length)return w.active!==false;let a=true;h.forEach(x=>{if(x.d<=d)a=x.a});return a};
const activeAny=(w,m)=>activeOn(w,m+'-01')||activeOn(w,mEnd(m))||(w.hist||[]).some(h=>h.a&&h.d.slice(0,7)==m);
const hasData=(w,m)=>S.att.some(r=>r.workerId==w.id&&r.date.slice(0,7)==m)||S.tx.some(q=>q.workerId==w.id&&qm(q)==m);
const visible=(w,m)=>activeAny(w,m)||hasData(w,m);
const SC={P:'text-emerald-600',H:'text-amber-600',A:'text-rose-600'};
const TC={take:'text-amber-600',adv:'text-purple-600',fine:'text-rose-600',ot:'text-sky-600',bonus:'text-emerald-600',extra:'text-teal-600'},PLUS=['ot','bonus','extra'],PAYT=['take','adv'];
const qm=q=>q.forMonth||q.date.slice(0,7);
function stat(w,m){const o={p:0,h:0,a:0,pd:[],hd:[],ad:[],wages:0,ot:0,otH:0,bonus:0,extra:0,gross:0,adv:0,fine:0,taken:0,tn:0,cut:0,prev:0,monNet:0,net:0,txs:[]};
S.att.forEach(r=>{if(r.workerId!=w.id||r.date.slice(0,7)!=m)return;const v=({P:1,H:.5}[r.status]||0)*r.wage;
if(r.status=='P'){o.p++;o.pd.push(r.date)}else if(r.status=='H'){o.h++;o.hd.push(r.date)}else{o.a++;o.ad.push(r.date)}o.wages+=v});
S.tx.forEach(q=>{if(q.workerId!=w.id||!(q.type in TC)||qm(q)!=m)return;o.txs.push(q);
if(q.type=='take'){o.taken+=q.amount;o.tn++}else if(q.type=='ot'){o.ot+=q.amount;o.otH+=q.hours||0}else o[q.type]+=q.amount});
['pd','hd','ad'].forEach(k=>o[k].sort());o.txs.sort((a,b)=>a.date<b.date?-1:1);
o.gross=o.wages+o.ot+o.bonus+o.extra;o.cut=o.adv+o.fine+o.taken;o.monNet=o.gross-o.cut;o.net=o.monNet;return o}
function nets(w){const o={};const add=(m,v)=>{o[m]=(o[m]||0)+v};
S.att.forEach(r=>{if(r.workerId==w.id)add(r.date.slice(0,7),({P:1,H:.5}[r.status]||0)*r.wage)});
S.tx.forEach(q=>{if(q.workerId==w.id&&q.type in TC)add(qm(q),(PLUS.includes(q.type)?1:-1)*q.amount)});return o}
function sumAll(w){const o={days:0,wages:0,add:0,cut:0,ms:{}};
S.att.forEach(r=>{if(r.workerId!=w.id)return;const k=({P:1,H:.5}[r.status]||0);o.days+=k;o.wages+=k*r.wage;o.ms[r.date.slice(0,7)]=1});
S.tx.forEach(q=>{if(q.workerId!=w.id||!(q.type in TC))return;o.ms[qm(q)]=1;if(PLUS.includes(q.type))o.add+=q.amount;else o.cut+=q.amount});
o.gross=o.wages+o.add;o.net=o.gross-o.cut;o.n=Object.keys(o.ms).length;return o}
const monthOpts=()=>{const a=[],d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);for(let i=0;i<26;i++){a.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d.setMonth(d.getMonth()-1)}return a};
const years=()=>{const a=[],y=new Date().getFullYear();for(let i=2022;i<=y+1;i++)a.push(i);return a};
const newTxId=()=>'tx-'+Math.random().toString(36).slice(2,10).padEnd(8,'x');

/* ---------- টাকার অঙ্ক কথায় (প্রিন্টে "In Word") ---------- */
function inWords(n){n=Math.round(Math.abs(n));if(!n)return'Zero Taka Only';
const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?' '+a[x%10]:''),three=x=>(x>=100?a[Math.floor(x/100)]+' Hundred'+(x%100?' ':''):'')+(x%100?two(x%100):'');
const parts=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
if(cr)parts.push(three(cr)+' Crore');if(lk)parts.push(two(lk)+' Lakh');if(th)parts.push(two(th)+' Thousand');if(n)parts.push(three(n));return parts.join(' ')+' Taka Only'}

function kpKey(e){if(e.ctrlKey||e.metaKey||e.altKey)return;const tg=e.target&&e.target.tagName;if(tg=='INPUT'||tg=='SELECT'||tg=='TEXTAREA')return;
const hosts=document.querySelectorAll('[data-kp]');if(!hosts.length){if(e.key==='Escape'&&(S.modal||S.sp||S.menu)){S.modal=null;S.sp=null;S.menu='';render()}return}
const h=hosts[hosts.length-1],tgt=h.dataset.kp;let d=null;
if(e.key>='0'&&e.key<='9'&&e.key.length==1)d=e.key;else if(e.code&&/^Numpad\d$/.test(e.code))d=e.code.slice(6);
if(d!==null){e.preventDefault();act('kp',{k:d,t:tgt})}else if(e.key==='Backspace'){e.preventDefault();act('kpb',{t:tgt})}else if(e.key==='Delete'){e.preventDefault();act('kpc',{t:tgt})}else if(e.key==='Escape'&&S.modal){S.modal=null;render()}else if(e.key==='Enter'){e.preventDefault();if(kpVal(tgt).length>=4)act(h.dataset.submit,{})}}

// লেবার তালিকায় সার্চ/কাজ/অবস্থা ফিল্টার ও সাজানো
function fws(list,m,amt){const q=String(fv('q')).trim().toLowerCase(),dg=fv('dg'),st=fv('st','all'),so=fv('so','ser');
let r=list.filter(x=>{const w=x.w||x;if(q&&!(w.name+' '+(w.mobile||'')+' '+(w.designation||'')).toLowerCase().includes(q))return false;
if(dg&&(w.designation||'').trim()!=dg)return false;
if(st!='all'){const on=m?activeAny(w,m):activeOn(w,today);if(st=='on'&&!on)return false;if(st=='off'&&on)return false}return true});
const nm=x=>(x.w||x).name||'';
if(so=='az')r.sort((a,b)=>nm(a).localeCompare(nm(b)));else if(so=='za')r.sort((a,b)=>nm(b).localeCompare(nm(a)));
else if(amt&&so=='hi')r.sort((a,b)=>amt(b)-amt(a));else if(amt&&so=='lo')r.sort((a,b)=>amt(a)-amt(b));
return r}

/* ===================== ১. হাজিরা রিপোর্ট ===================== */
const attAmt=s=>s.p+s.h/2;
function attRows(m){let ws=S.ws.filter(w=>visible(w,m)).map(w=>({w,s:stat(w,m)}));const af=fv('af','');
if(af=='abs')ws=ws.filter(r=>r.s.a>0);else if(af=='full')ws=ws.filter(r=>r.s.a==0&&r.s.h==0&&r.s.p>0);else if(af=='none')ws=ws.filter(r=>!(r.s.p+r.s.h+r.s.a));
return fws(ws,m,r=>attAmt(r.s))}
function attList(rows){const T={p:0,h:0,a:0,d:0,w:0};rows.forEach(({s})=>{T.p+=s.p;T.h+=s.h;T.a+=s.a;T.d+=attAmt(s);T.w+=s.wages});
return TBX(th(t('sl'),'w-8')+thL(t('worker'))+thL(B('কাজের ধরন','Work type'))+th(t('perDay'))+th(t('P'),'text-emerald-300')+th(t('H'),'text-amber-300')+th(t('A'),'text-rose-300')+th(t('workDays'))+th(t('earn')),
rows.map(({w,s},i)=>`<tr data-act="openw" data-id="${w.id}" class="cursor-pointer">${td(i+1)}${tdL(wcell(w))}${tdL(esc(w.designation||'-'))}${td(tk(w.wage))}${td(s.p,'font-bold text-emerald-600')}${td(s.h,'font-bold text-amber-600')}${td(s.a,'font-bold text-rose-600')}${td(num(attAmt(s)),'font-black')}${td(tk(s.wages),'font-bold')}</tr>`).join('')||emptyRow(9),
rows.length?`<tr class="bg-slate-100 dark:bg-slate-800 font-bold border-t-2 border-slate-800">${tf(t('total'),'',4)}${tf(T.p,'text-emerald-600')}${tf(T.h,'text-amber-600')}${tf(T.a,'text-rose-600')}${tf(num(T.d))}${tf(tk(T.w))}</tr>`:'')}
function attReg(rows,m){const[y,mo]=m.split('-').map(Number),nd=new Date(y,mo,0).getDate(),ds=[];for(let i=1;i<=nd;i++)ds.push(m+'-'+pad(i));
const mk={P:['✓','text-emerald-600'],H:['½','text-amber-600'],A:['✗','text-rose-600']};
return TBX(th(t('sl'),'w-8')+thL(t('worker'))+ds.map(d=>{const dw=new Date(d+'T00:00:00').getDay();return th(`<div>${+d.slice(8)}</div><div class="text-[8px] font-semibold opacity-80">${WDS[L()][dw]}</div>`,'scs-day '+(dw==5?'text-rose-300 ':'')+(d==today?'scs-today':''))}).join('')+th(t('Ps'),'text-emerald-300')+th(t('Hs'),'text-amber-300')+th(t('As'),'text-rose-300')+th(t('days')),
rows.map(({w,s},i)=>`<tr data-act="openw" data-id="${w.id}" class="cursor-pointer">${td(i+1)}${tdL(`<span class="font-bold whitespace-nowrap">${esc(w.name)}</span>`)}${ds.map(d=>{const r=S.am[d+'|'+w.id];return r?td(mk[r.status][0],'font-black scs-day '+mk[r.status][1]+(d==today?' scs-today':'')):td(activeOn(w,d)?'':'–','scs-day text-slate-400'+(d==today?' scs-today':''))}).join('')}${td(s.p,'font-black text-emerald-600')}${td(s.h,'font-black text-amber-600')}${td(s.a,'font-black text-rose-600')}${td(num(attAmt(s)),'font-black')}</tr>`).join('')||emptyRow(nd+6),'','scs-reg')+
`<div class="text-[11px] font-semibold text-slate-500 mt-2 flex gap-3 flex-wrap justify-center"><span class="text-emerald-600">✓ ${t('P')}</span><span class="text-amber-600">½ ${t('H')}</span><span class="text-rose-600">✗ ${t('A')}</span><span>– ${t('inact')}</span></div>`}
function attCards(rows){return rows.length?`<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">${rows.map(({w,s})=>`<div class="group cursor-pointer rounded-3xl p-5 bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-md hover:shadow-xl hover:border-pink-300 transition-all duration-200" data-act="openw" data-id="${w.id}">

function attTiles(rows){const T={p:0,h:0,a:0,d:0,w:0};rows.forEach(({s})=>{T.p+=s.p;T.h+=s.h;T.a+=s.a;T.d+=attAmt(s);T.w+=s.wages});

${v=='card'?`<div class="no-print">${attCards(rows)}</div><div class="scs-print-only">${rcard('rc-att-p',B('লেবার হাজিরা','WORKER ATTENDANCE')+' — '+fmon(m).toUpperCase(),'',attTiles(rows)+attList(rows))}</div>`:rcard('rc-att',(v=='reg'?B('হাজিরা রেজিস্টার','ATTENDANCE REGISTER'):B('লেবার হাজিরা','WORKER ATTENDANCE'))+' — '+fmon(m).toUpperCase(),'',body)}</div>`}

function vEntry(){if(!S.admin)return cardBox(`<div class="text-center py-10 text-slate-400 font-bold">${t('entryOnly')}</div>`);

<div class="scs-row" style="margin-top:10px;flex-wrap:wrap"><button type="button" data-act="absave" class="scs-btn scs-btn-p">${B('সেটিংস সেভ করুন','Save settings')}</button><button type="button" data-act="abnow" class="scs-btn scs-btn-o">${B('এখনই ব্যাকআপ নিন','Backup now')}</button><button type="button" data-act="abload" class="scs-btn scs-btn-o">⟳</button>${ab.folderUrl?`<a href="${esc(ab.folderUrl)}" target="_blank" class="scs-btn scs-btn-o">${B('ফোল্ডার খুলুন','Open folder')}</a>`:''}</div>
<div class="scs-abk-st"><div>${B('শেষ ব্যাকআপ','Last backup')}: <b>${dt(ab.lastRun)}</b>${ab.lastFileUrl?` — <a href="${esc(ab.lastFileUrl)}" target="_blank" class="text-pink-600 font-bold">${esc(ab.lastFile)}</a>`:''}</div><div>${B('শেষ চেক','Last check')}: ${dt(ab.lastCheck)}</div><div>${B('ফোল্ডার','Folder')}: ${esc(ab.folderName||'—')}</div>${ab.lastError?`<div class="text-rose-600 font-semibold">${B('সমস্যা','Error')}: ${esc(ab.lastError)}</div>`:''}</div>

<div class="bg-white dark:bg-slate-900 rounded-2xl p-3 border border-slate-300 dark:border-slate-700 mb-2.5 scs-abk">${abBox}</div>
${aBackupJson()}</div>`}

${sbox(B('এডমিন লক','Lock Admin'),B('এখনই এডমিন মেনু বন্ধ করুন। আবার খুলতে পিন লাগবে। লগআউট করে আবার ঢুকলেও এডমিন লক থাকে।','Close the admin menu now. A PIN is needed to open it again. It is also locked after logging in again.'),`<button type="button" data-act="aLock" class="${BTNR}">${ic('lock','w-3.5 h-3.5')}${B('এডমিন লক করুন','Lock admin')}</button>`)}

<div class="flex flex-wrap items-center gap-2"><input type="password" inputmode="numeric" maxlength="8" autocomplete="off" data-f="expin" value="${esc(S.f.expin||'')}" placeholder="PIN" class="w-32 p-2 border rounded-xl bg-slate-50 dark:bg-slate-800 text-xs text-center tracking-widest"><button type="button" data-act="exjson" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white text-xs font-bold cursor-pointer inline-flex items-center gap-1.5">${ic('dl','w-3.5 h-3.5')}${B('JSON এক্সপোর্ট','Export JSON')}</button></div></div>

${R?`<div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 text-[11px] space-y-1"><div><b>${B('ফাইল','File')}:</b> ${esc(R.name)}</div><div><b>${B('ধরন','Scope')}:</b> ${R.scope=='lifetime'?B('লাইফটাইম','Lifetime'):R.scope=='year'?B('বছর','Year')+' '+R.period:B('মাস','Month')+' '+fmon(R.period)} • <b>${B('তৈরি','Exported')}:</b> ${dt(R.exportedAt)}</div><div><b>${B('আছে','Contains')}:</b> ${R.counts.workers} ${B('লেবার','workers')}, ${R.counts.attendance} ${B('হাজিরা','attendance')}, ${R.counts.tx} ${B('লেনদেন','transactions')}, ${R.counts.status} ${B('চালু/বন্ধ রেকর্ড','status rows')}</div></div>

<label class="flex items-center gap-2 text-xs cursor-pointer"><input type="checkbox" data-f="rpin" ${S.f.rpin?'checked':''}><span>${B('ফাইলের এডমিন পিন ও সেটিংসও ফেরান','Also restore admin PIN & settings from the file')}</span></label></div>
<div class="flex flex-wrap items-center gap-2"><input type="password" inputmode="numeric" maxlength="8" autocomplete="off" data-f="rspin" value="${esc(S.f.rspin||'')}" placeholder="PIN" class="w-32 p-2 border rounded-xl bg-slate-50 dark:bg-slate-800 text-xs text-center tracking-widest"><button type="button" data-act="restore" class="${BTN}">${ic('ul','w-3.5 h-3.5')}${B('রিস্টোর করুন','Restore')}</button><button type="button" data-act="rcancel" class="${BTNO}">${t('cancel')}</button></div>
<p class="text-[10px] text-slate-400">${B('রিস্টোরের আগে বর্তমান ডাটার একটি নিরাপত্তা ব্যাকআপ গুগল ড্রাইভে নেওয়া হয়।','A safety backup of current data is saved to Google Drive before restoring.')}</p>`:''}</div>

`}
function aLogo(){return sbox(B('এডমিন লোগো সেটআপ','Admin Logo Setup'),B('লোগো উপরের বারে ও প্রতিটি রিপোর্ট প্রিন্টে দেখাবে। PNG/JPG/WEBP/SVG, ১.৫ MB এর ছোট।','The logo shows in the top bar and on every printed report. PNG/JPG/WEBP/SVG under 1.5 MB.'),`<div class="flex items-center gap-4 flex-wrap"><img src="${esc(logo())}" class="w-20 h-20 rounded-full border-2 border-pink-300 object-contain bg-white p-1"><div class="space-y-2"><label class="${BTN}">${ic('ul','w-3.5 h-3.5')}${B('নতুন লোগো বাছুন','Choose new logo')}<input type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" data-file="logo" class="hidden"></label>${S.cfg.logo?`<button type="button" data-act="logodel" class="${BTNO} ml-2">${B('লোগো সরান (ডিফল্ট)','Remove logo (default)')}</button>`:''}<p class="text-[11px] text-slate-500">${S.cfg.logo?B('কাস্টম লোগো চালু আছে।','Custom logo in use.'):B('এখন ডিফল্ট SCS লোগো দেখাচ্ছে।','Default SCS logo in use.')}</p></div></div>`)}

/* ---- দিন অনুযায়ী হিসাব (লেজার): প্রতিটি তারিখ শেষে কত পাওনা ছিল ---- */
function ledgerRows(w){const D={};const g=d=>D[d]=D[d]||{d,st:'',earn:0,add:0,cut:0,take:0,notes:[]};
S.att.forEach(r=>{if(r.workerId!=w.id)return;const o=g(r.date);o.st=r.status;o.earn+=({P:1,H:.5}[r.status]||0)*r.wage});
S.tx.forEach(q=>{if(q.workerId!=w.id||!(q.type in TC))return;const o=g(q.date);if(PLUS.includes(q.type))o.add+=q.amount;else if(q.type=='take')o.take+=q.amount;else o.cut+=q.amount;o.notes.push((PLUS.includes(q.type)?'+':'−')+t(q.type)+' '+tn(q.amount)+(q.note?' ('+q.note+')':''))});
let bal=0;return Object.values(D).sort((a,b)=>a.d<b.d?-1:1).map(o=>{bal+=o.earn+o.add-o.cut-o.take;o.bal=bal;return o})}

const mk={P:['✓',SC.P],H:['½',SC.H],A:['✗',SC.A]};
const body=`<div id="pa-modal"><div class="flex items-center gap-3 mb-2">${av(w,'w-12 h-12 text-lg')}<div class="min-w-0"><div class="text-base font-black">${esc(w.name)}</div><div class="text-[11px] text-slate-600 dark:text-slate-300">${esc(w.designation||'-')} • ${t('perDay')} ${tk(w.wage)}</div></div></div>
${tiles(mini(B('পাওনা ছিল','Payable on')+' '+sdate(Dt),tk(o.net),o.net>=0?'text-emerald-700':'text-rose-600')+mini(B('ঐ দিন পর্যন্ত মজুরি + যোগ','Earned till date'),tk(o.gross),'text-sky-700')+mini(B('ঐ দিন পর্যন্ত নেওয়া/কাটা','Taken/deducted till date'),tk(o.cut),'text-amber-700')+mini(B('তারিখের পরে দেওয়া','Paid after date'),tk(o.later),'text-purple-700'))}
<div class="no-print flex items-center gap-2 flex-wrap mb-2"><span class="text-[11px] font-bold">${B('মাস','Month')}:</span><select data-f="lgr.mo" data-re="1" class="scs-in scs-in-sm" style="width:auto">${[['',B('সব মাস','All months')],...mos.map(k=>[k,fmon(k)])].map(([v,l])=>`<option value="${v}" ${F.mo==v?'selected':''}>${l}</option>`).join('')}</select><span class="text-[11px] text-slate-600 dark:text-slate-300">${B('গোলাপি সারি = নির্বাচিত তারিখ। "দিন শেষে পাওনা" মানে ঐ দিনের সব হিসাবের পরে কত পাওনা ছিল।','Pink row = the chosen date. "Balance" is what was payable at the end of that day.')}</span></div>
${TBX(th(t('date'))+th(B('হাজিরা','Attendance'))+th(t('earn'))+th(B('যোগ','Added'),'text-emerald-300')+th(B('অগ্রিম/জরিমানা','Advance/fine'),'text-rose-300')+th(t('cashS'),'text-rose-300')+thL(B('বিবরণ','Details'))+th(B('দিন শেষে পাওনা','Balance (end of day)'),'font-black bg-slate-900 text-rose-400'),
rows.map(x=>`<tr class="${x.d==Dt?'scs-asof':''}">${td(sdate(x.d)+' <span class="text-[9px]">'+wday(x.d).slice(0,L()=='en'?3:undefined)+'</span>','whitespace-nowrap')}${td(x.st?mk[x.st][0]:'-','font-black '+(x.st?mk[x.st][1]:''))}${td(x.earn?tn(x.earn):'-')}${td(x.add?'+'+tn(x.add):'-','text-emerald-700')}${td(x.cut?'−'+tn(x.cut):'-','text-purple-700')}${td(x.take?'−'+tn(x.take):'-','text-amber-700')}${tdL(esc(x.notes.join('; '))||'-')}${td(tk(x.bal),'font-black '+(x.bal>=0?'text-emerald-700':'text-rose-600'))}</tr>`).join('')||emptyRow(8,t('noTx')))}</div>`;
return panel('📒 '+B('দিন অনুযায়ী হিসাব','Day-by-day ledger')+' • '+esc(w.name),body,`<div class="flex gap-2"><span style="flex:1"></span>${isVis()?'':`<button type="button" data-act="prt" data-k="modal" class="${BTN}">${ic('print','w-3.5 h-3.5')}${t('print')}</button>`}<button type="button" data-act="closeM" class="${BTNO}">${t('close')}</button></div>`,true)}

function render(){document.documentElement.lang=L();document.title=B('SCS লেবার হাজিরা ও মজুরি','SCS Worker Attendance & Wage');
const ae=document.activeElement,fk=ae&&(ae.dataset.flt?'flt:'+ae.dataset.flt:ae.dataset.hf?'hf:'+ae.dataset.hf:ae.dataset.f?'f:'+ae.dataset.f:''),sel=fk&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;

function bkTotals(){const Bk=S.bulk;if(!Bk)return;const rows=bulkRows(Bk.month);let n=0,tot=0;rows.forEach(r=>{if(Bk.off[r.id])return;const a=Math.round(+(Bk.amt[r.id]??r.due));if(a>0){n++;tot+=a}});
const c=document.getElementById('bkcnt'),e=document.getElementById('bktot');if(c)c.textContent=n+' '+t('selCnt');if(e)e.textContent=tk(tot)}
function toGate(){if(window.SCS&&SCS.reloadApp&&S.mode=='admin'){SCS.reloadApp();return}S.admin=false;S.aul=false;S.f.apw='';S.token='';S.draft={};S.ws=[];S.att=[];S.tx=[];S.am={};S.modal=null;S.sp=null;S.tab='dash';S.vset=null;S.aset=null;S.ab=null;S.logs=null;S.screen='gate';S.f={pw:''}}

/* ---------- সেভ কিউ (আগের মতো): দ্রুত UI, ক্রমানুসারে সার্ভারে সেভ ---------- */
const slp=ms=>new Promise(r=>setTimeout(r,ms));
const Q={list:[],busy:false,n:0,fail:false};
const pendUI=()=>{const e=document.getElementById('pend');if(e)e.style.display=Q.n?'flex':'none'};
const drain=async()=>{while(Q.n)await slp(120)};
function enqueue(fn,args){Q.n++;Q.list.push({fn,args});pendUI();pump()}
async function pump(){if(Q.busy)return;Q.busy=true;
while(Q.list.length){const j=Q.list[0];let r=null,err='';
for(let k=0;k<3;k++){try{r=await run(j.fn,S.token,...j.args);break}catch(e){err=e.message||String(e);await slp(900*(k+1))}}
if(r&&r.auth){Q.list=[];Q.n=0;Q.fail=true;toGate();render();toast(t('relogin'),1);break}
Q.list.shift();Q.n--;pendUI();
if(!r||!r.success){Q.fail=true;toast((r&&r.error)||t('connErr')+(err?': '+err:''),1)}}
Q.busy=false;pendUI();if(Q.fail){Q.fail=false;await load(true)}}
window.addEventListener('beforeunload',e=>{if(Q.n){e.preventDefault();e.returnValue=''}});
async function adm(fn,...a){await drain();try{const r=await run(fn,S.token,...a);
if(r&&r.auth){toGate();render();toast(t('relogin'),1);return null}
if(!r||!r.success){toast(r&&r.code=='pin'?t('wrong')+(r.left!=null?' ('+r.left+' '+t('left')+')':''):r&&r.code=='locked'?t('locked'):(r&&r.error)||'Error',1);return null}return r}catch(e){toast(t('connErr')+': '+(e.message||e),1);return null}}
async function load(quiet){if(S.mode=='admin'&&!S.admin)return;await drain();S.syncing=true;if(!S.loading)render();
try{const[d,c]=await Promise.all([run('getData',ctx()),run('getUiConfig',ctx()).catch(()=>null)]);
if(d&&d.auth){S.syncing=false;if(S.mode=='admin'){toGate();render();toast(t('relogin'),1)}else{S.vs='';LS.s('lab_vs_'+BOOT.v.slice(0,10),'');S.screen=(d.code=='off'||!S.vpinReq)?'deny':'vpin';render()}return}
S.ws=d.workers;S.att=d.attendance;S.tx=d.tx;rebuild();if(isVis()&&!['att','money'].includes(S.tab))S.tab='att';if(c&&c.success)S.cfg={logo:c.logo,signatures:c.signatures||[],musicUrl:c.musicUrl,musicFile:c.musicFile}}catch(e){toast(t('connErr')+': '+(e.message||e),1)}
S.loading=false;S.syncing=false;render();if(S.tab=='admin')loadAdminTab()}
async function loadAdminTab(){if(!S.aul)return;const at=S.atab;
if(at=='visitor'){const r=await adm('getVisitorSettings');if(r){S.vset=r;render()}}
else if(at=='sheet'||at=='music'||at=='backup'){const r=await adm('getAdminSettings');if(r){S.aset=r;render()}if(at=='backup'){const b=await adm('getAutoBackupConfig');if(b){S.ab=b;render()}}}}
async function loadLogs(){const F=S.f.lg||(S.f.lg={p:'life',q:'',a:'',s:''});let from='',to='';
if(F.p=='this'){from=today.slice(0,7)+'-01';to=today}else if(F.p=='month'){from=S.month+'-01';to=mEnd(S.month)}else if(F.p=='year'){from=today.slice(0,4)+'-01-01';to=today.slice(0,4)+'-12-31'}
S.logs=null;render();const r=await adm('getActivityLog',from,to);S.logs=r?r.rows:[];render()}

S.f.rs={name:f.name,txt,scope:p.scope,period:p.period||'',exportedAt:p.exportedAt,counts:{workers:(p.data.workers||[]).length,attendance:(p.data.attendance||[]).length,tx:(p.data.tx||[]).length,status:(p.data.status||[]).length}};S.f.rmode='merge';S.f.rpin=false;render()}
catch(x){el.value='';toast(B('ফাইল পড়া যায়নি: ','Could not read file: ')+(x.message||x),1)}}

rows.forEach(r=>{if(Bk.off[r.id])return;const am=Math.round(+(Bk.amt[r.id]??r.due));if(!(am>0))return;if(am>r.due){over=true;return}list.push({id:newTxId(),workerId:r.id,date:Bk.date,type:'take',amount:am,hours:0,forMonth:Bk.month,note:t('bulkNote')});tot+=am});
if(over)return toast(t('bulkOver'),1);if(!list.length)return toast(t('needInfo'),1);
S.tx.push(...list);S.month=Bk.month;S.modal=null;S.bulk=null;render();enqueue('saveTxBatch',[list,S.txPin]);S.txPin='';toast(L()=='en'?`Paid ${list.length} workers, total ${tk(tot)}`:`${list.length} জনকে মোট ${tk(tot)} দেওয়া হয়েছে`)}
else if(a=='fillDue'){const f=S.f.p,v=dueOf(f.workerId,f.forMonth||f.date.slice(0,7));if(v>0){f.amount=String(v);render()}}
else if(a=='addtx'){const dt=d.date||today,wid=d.id||(S.ws.find(w=>activeOn(w,dt))||{}).id||'';if(!S.admin)return;S.txPin='';const fp={type:d.type||'take',workerId:wid,date:dt,forMonth:'',amount:'',hours:'',note:''},w0=wid&&d.id?wk(wid).name+' • ':'';askPin(w0+B('টাকার এন্ট্রি খুলতে এডমিন পিন দিন','Enter the admin PIN to open the money entry'),'openTx',{fp,prev:S.modal})}
else if(a=='doTx'){const p=S.f.p;if(!p.workerId||!(+p.amount>0)||!p.date)return toast(t('needInfo'),1);
if(p.type=='ot'&&!(+p.hours>0))return toast(t('hoursNeed'),1);
if(S.modal&&S.modal.edit){const q={id:S.modal.edit,workerId:p.workerId,date:p.date,type:p.type,amount:+p.amount,hours:p.type=='ot'?+p.hours:0,forMonth:p.forMonth||'',note:p.note||''};
return askPin(B('এন্ট্রি আপডেট করতে এডমিন পিন দিন','Enter the admin PIN to update the entry'),'updTx',{data:q})}
const q={id:newTxId(),workerId:p.workerId,date:p.date,type:p.type,amount:+p.amount,hours:p.type=='ot'?+p.hours:0,forMonth:p.forMonth||'',note:p.note||''};
if(!S.txPin){S.modal=null;render();return toast(B('পিন ছাড়া এন্ট্রি হবে না — আবার পিন দিন','No entry without the PIN — enter it again'),1)}
S.tx.push(q);S.month=qm(q);S.modal=null;render();enqueue('saveTx',[q,S.txPin]);S.txPin='';toast(t('saved')+' • 🔒 '+B('এন্ট্রি আবার লক হয়েছে','Entry locked again'))}
else if(a=='deltx')askPin(t('cfTx'),'deltx',{id:d.id});
/* ---- লেবার ---- */
else if(a=='delW')askPin(t('cfDel'),'delW',{id:d.id});
else if(a=='saveW'){const w=S.f.w||{};if(!(w.name||'').trim())return toast(t('needInfo'),1);
askPin(t('cfSaveW'),'saveW',{data:{id:w.id||'',name:w.name,mobile:w.mobile||'',designation:w.designation||'',wage:+w.wage||0,photo:w.photo||''}})}
else if(a=='editW'){S.f.w={...wk(d.id)};render();scrollTo(0,0)}
else if(a=='cancelW'){S.f.w={};render()}
else if(a=='togW'){const w=wk(d.id),nv=!activeOn(w,today);w.hist=(w.hist||[]).filter(h=>h.d!=today).concat({d:today,a:nv}).sort((x,y)=>x.d<y.d?-1:1);w.active=nv;render();enqueue('setActive',[w.id,nv,today])}
else if(a=='mv'){const i=S.ws.findIndex(w=>w.id==d.id);moveTo(d.id,i+ +d.d)}
else if(a=='pcGo'){const m=S.modal,pin=S.f.pc||'';if(!m||m.t!='pc')return;if(!/^\d{4,8}$/.test(pin))return toast(t('pinBad'),1);
const b=document.getElementById('pcbtn');if(b){b.disabled=true;b.innerHTML=t('wait')}let r=null;
if(m.a=='openTx'||m.a=='openBulk'){r=await adm('checkPin',pin);if(r){S.txPin=pin;if(m.a=='openTx'){S.f.p=m.fp;S.modal={t:'tx'}}else{S.bulk=m.bulk;S.modal={t:'bulk'}}render();toast('🔓 '+B('এন্ট্রি খোলা হয়েছে — সেভ করলে আবার লক হবে','Entry unlocked — it locks again after saving'))}else if(S.modal===m){S.f.pc='';render()}return}
if(m.a=='deltx'){r=await adm('deleteTx',m.id,pin);if(r)S.tx=S.tx.filter(q=>q.id!=m.id)}
else if(m.a=='updTx'){r=await adm('updateTx',m.data,pin);if(r){const i=S.tx.findIndex(q=>q.id==m.data.id);if(i>=0)S.tx[i]={...m.data}}}
else if(m.a=='delW'){r=await adm('deleteWorker',m.id,pin);if(r){S.ws=S.ws.filter(w=>w.id!=m.id);S.att=S.att.filter(x=>x.workerId!=m.id);S.tx=S.tx.filter(q=>q.workerId!=m.id);rebuild()}}
else if(m.a=='saveAtt'){r=await adm('saveAttendance',m.data,pin);if(r)applyAtt(m.data)}
else if(m.a=='saveW'){const w=m.data;r=await adm('saveWorker',w,pin);if(r){const o=S.ws.find(x=>x.id==r.id)||{hist:[],active:true},n={...o,id:r.id,name:w.name.trim(),mobile:w.mobile,designation:w.designation,wage:w.wage,photo:w.photo,sort:r.sort};const i=S.ws.findIndex(x=>x.id==r.id);if(i>=0)S.ws[i]=n;else S.ws.push(n);S.f.w={};rebuild()}}
if(r){S.modal=m.back?{t:m.back}:null;render();toast(t('saved'))}else if(S.modal===m){S.f.pc='';render()}}
/* ---- ভিজিটর ---- */
else if(a=='vcreate'){const r=await adm('setVisitor','create');if(r){S.vset=r;render();toast(t('saved'))}}
else if(a=='vtoggle'){const r=await adm('setVisitor','toggle',!S.vset.enabled);if(r){S.vset=r;render();toast(t('saved'))}}
else if(a=='vregen'){S.modal={t:'cf',msg:t('visRegenCf'),a:'vregen'};render()}
else if(a=='cfGo'){const m=S.modal;S.modal=null;render();if(m&&m.a=='vregen'){const r=await adm('setVisitor','regen');if(r){S.vset=r;render();toast(t('saved'))}}}
else if(a=='vpinset'){const pin=S.f.vp||'';if(!/^\d{4,8}$/.test(pin))return toast(t('pinBad'),1);const r=await adm('setVisitor','setPin',pin);if(r){S.vset=r;S.f.vp='';render();toast(t('pinSaved'))}}
else if(a=='vpinoff'){const r=await adm('setVisitor','setPin','');if(r){S.vset=r;render();toast(t('saved'))}}
else if(a=='vcopy'){copyText(S.vset&&S.vset.url||'')}
/* ---- এডমিন সেটিংস ---- */
else if(a=='doPin'){const p=S.f.pn||{};if(!/^\d{4,8}$/.test(p.n||''))return toast(t('pinBad'),1);if(p.n!==p.n2)return toast(t('pinMis'),1);
const r=await adm('changePin',p.o||'',p.n);if(r){S.f.pn={};render();toast(t('pinOk'))}}
else if(a=='doUPin'){const p=S.f.upn||{};if(!/^\d{4,8}$/.test(p.n||''))return toast(t('pinBad'),1);if(p.n!==p.n2)return toast(t('pinMis'),1);
const r=await adm('changeUserPin',p.a||'',p.n);if(r){S.f.upn={};render();toast(B('ইউজার পিন বদলানো হয়েছে','User PIN changed'))}}
else if(a=='wshare'){const w=wk(d.id),prev=S.modal;toast(B('ছবি তৈরি হচ্ছে…','Creating image…'));const url=await workerCardImage(w,S.month);if(!url)return toast(B('ছবি তৈরি করা যায়নি','Could not create the image'),1);
const fn=('SCS_'+w.name+'_'+S.month).replace(/[\\/:*?"<>|\s]+/g,'_')+'.png';S.modal={t:'shimg',url,name:w.name,fn,prev};render()}
else if(a=='imgdl'){const m=S.modal;if(!m||!m.url)return;const ab=document.createElement('a');ab.href=URL.createObjectURL(dataUrlFile(m.url,m.fn));ab.download=m.fn;document.body.appendChild(ab);ab.click();setTimeout(()=>{URL.revokeObjectURL(ab.href);ab.remove()},1500);toast('✔ '+B('ছবি ডাউনলোড হয়েছে','Image downloaded'))}
else if(a=='imgshare'){const m=S.modal;if(!m||!m.url)return;try{const f=dataUrlFile(m.url,m.fn);if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:m.name,text:m.name+' • '+fmon(S.month)});return}}catch(e){if(e&&e.name=='AbortError')return}
act('imgdl',{});toast(B('এই ব্রাউজারে সরাসরি শেয়ার হয় না — ছবি ডাউনলোড হয়েছে, এখন যেকোনো অ্যাপে পাঠাতে পারবেন','Direct share is not available here — the image was downloaded, send it from any app'),0)}
else if(a=='repair'){const r=await adm('repairSheets');if(r){S.aset=r;render();toast(t('saved'))}}
else if(a=='foldsave'){const r=await adm('saveDriveFolder',S.f.fold??'');if(r){S.aset=r;S.f.fold=undefined;render();toast(t('saved'));const b=await adm('getAutoBackupConfig');if(b){S.ab=b;render()}}}
else if(a=='msave'){const u=S.f.murl??'';const r=await adm('saveMusicUrl',u);if(r){S.cfg.musicUrl=u.trim();S.cfg.musicFile=false;if(S.aset){S.aset.musicUrl=u.trim();S.aset.musicFile=false}S.f.murl=undefined;render();toast(t('saved'))}}
else if(a=='logodel'){const r=await adm('removeLogo');if(r){S.cfg.logo='';render();toast(t('saved'))}}
else if(a=='sigadd'){(S.f.sig=S.f.sig||[]).push({label:'',name:'',designation:''});render()}
else if(a=='sigdel'){S.f.sig.splice(+d.i,1);render()}
else if(a=='sigsave'){const r=await adm('saveSignatures',JSON.stringify(S.f.sig||[]));if(r){S.cfg.signatures=r.signatures;S.f.sig=null;render();toast(t('saved'))}}
else if(a=='abload'){S.ab=null;render();const b=await adm('getAutoBackupConfig');if(b){S.ab=b;render()}}
else if(a=='absave'){const b=await adm('saveAutoBackupConfig',{enabled:!!S.ab.enabled,interval:S.ab.interval,keepMode:S.ab.keepMode,keepValue:+S.ab.keepValue,onlyChanged:!!S.ab.onlyChanged});if(b){S.ab=b;render();toast(t('saved'))}}
else if(a=='abnow'){toast(B('ড্রাইভে ব্যাকআপ হচ্ছে…','Backing up to Drive…'));const r=await adm('runDriveBackupNow');if(r){toast('✔ '+r.file.name);const b=await adm('getAutoBackupConfig');if(b){S.ab=b;render()}}}
else if(a=='exscope'){S.f.ex.scope=d.v;render()}
else if(a=='exjson'){const pin=S.f.expin||'';if(!/^\d{4,8}$/.test(pin))return toast(t('pinBad'),1);const E=S.f.ex;
toast(B('ব্যাকআপ তৈরি হচ্ছে…','Preparing backup…'));const r=await doExport(pin,E.scope,E.scope=='year'?E.year:E.scope=='month'?E.month:'');
if(r){S.f.expin='';render();toast(`✔ ${B('ডাউনলোড হয়েছে','Downloaded')} (${r.counts.workers} ${B('লেবার','workers')}, ${r.counts.attendance} ${B('হাজিরা','attendance')}, ${r.counts.tx} ${B('লেনদেন','tx')})`)}}
else if(a=='rcancel'){S.f.rs=null;render()}
else if(a=='restore'){const R=S.f.rs,pin=S.f.rspin||'';if(!R)return;if(!/^\d{4,8}$/.test(pin))return toast(t('pinBad'),1);
if(S.f.rmode=='replace'&&!confirm(B('রিপ্লেস মোডে বর্তমান ডাটা ফাইলের মতো হয়ে যাবে। নিশ্চিত?','Replace mode makes current data match the file. Continue?')))return;
toast(B('রিস্টোর হচ্ছে… অপেক্ষা করুন','Restoring… please wait'));const r=await adm('restoreBackup',pin,R.txt,S.f.rmode||'merge',!!S.f.rpin);
if(r){const rp=r.report;S.f.rs=null;S.f.rspin='';toast(`✔ ${B('রিস্টোর সম্পন্ন','Restore complete')}: ${B('লেবার','workers')} ${rp.workers.total}, ${B('হাজিরা','attendance')} ${rp.attendance.total}, ${B('লেনদেন','tx')} ${rp.tx.total}`);await load()}}
else if(a=='resetStart'){S.f.rsp='';S.f.rstx='';S.f.rsok=false;S.modal={t:'reset',step:1};render()}
else if(a=='resetStep'){const m=S.modal,pin=S.f.rsp||'';if(!/^\d{4,8}$/.test(pin))return toast(t('pinBad'),1);const b=document.getElementById('rsbtn');if(b){b.disabled=true;b.textContent=t('wait')}
if(m.step==1){const r=await doExport(pin,'lifetime','');if(r){m.step=2;m.file=r.name;S.f.rsp=''}render()}
else if(m.step==2){const r=await adm('checkPin',pin);if(r){m.step=3;S.f.rsp=''}render()}
else if(m.step==3){if(!S.f.rsok){render();return toast(B('আগে টিক চিহ্ন দিন','Tick the box first'),1)}const r=await adm('checkPin',pin);if(r){m.step=4;S.f.rsp=''}render()}
else{if(String(S.f.rstx||'').trim()!=='RESET'){render();return toast(B('RESET লিখুন','Type RESET'),1)}
const r=await adm('resetAll',pin,'RESET');if(r){S.modal=null;toast(B('রিসেট সম্পন্ন। ','Reset complete. ')+(r.safety?B('ড্রাইভে নিরাপত্তা ব্যাকআপ: ','Drive safety backup: ')+r.safety:''));await load()}else render()}}
else if(a=='xprint'){const parts=buildRange();if(!parts.length)return toast(B('কিছু বাছাই করা হয়নি','Nothing selected'),1);printHTML(parts.map(p=>`<div class="scs-page">${p.html}</div>`).join(''),true)}
else if(a=='xcsv'){const parts=buildRange();if(!parts.length)return toast(B('কিছু বাছাই করা হয়নি','Nothing selected'),1);
download('SCS_Worker_Reports_'+rangeMonths()[0]+'_to_'+rangeMonths().slice(-1)[0]+'.csv','﻿"'+COMPANY+'"\r\n'+parts.map(p=>'\r\n"'+(p.el.querySelector('h1')||{innerText:''}).innerText.replace(/"/g,'""')+'"\r\n'+tableCSV(p.el)).join('\r\n'),'text/csv;charset=utf-8');toast(B('CSV ডাউনলোড হয়েছে','CSV downloaded'))}
else if(a=='codecopy'){copyText(srcCode(),1)}
else if(a=='codedl'){download('Code.gs',srcCode(),'text/plain;charset=utf-8')}
}
function copyText(txt,isCode){const ok=()=>toast(isCode?B('কোড কপি হয়েছে','Code copied'):t('visCopied')),fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{if(document.execCommand('copy'))ok()}catch(e){}ta.remove()};
try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fb);return}}catch(e){}fb()}
applyTheme();boot();


</script>
