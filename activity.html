<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Activity Log · SCS</title>
<link rel="icon" type="image/png" href="assets/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/portal.css" />
<style>
  body.embed .top, body.embed .bg-art { display: none; }
  body.embed .wrap { padding: 14px 12px 40px; }
</style>
</head>
<body>
<div class="bg-art" aria-hidden="true"><span class="glow"></span><span class="ring r1"></span><span class="ring r2"></span><img data-scs-logo alt="" /></div>
<header class="top">
  <div class="in">
    <a class="logo" href="./"><span class="mk"><img data-scs-logo alt="SCS" /></span><span><b data-i="Activity Log|অ্যাক্টিভিটি লগ"></b><small data-i="Who changed what, and when — lifetime history|কে, কখন, কী বদলেছে — লাইফটাইম হিস্ট্রি"></small></span></a>
    <div class="act" id="topAct"><a class="chip" href="./">🏠 <span class="hide-sm" data-i="Home|হোম"></span></a></div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <select id="fApp" class="in-f" style="flex:none;min-width:190px"></select>
    <select id="fAct" class="in-f" style="flex:none;min-width:120px">
      <option value="" data-i="All actions|সব কাজ"></option><option value="Add" data-i="Add (new)|Add (নতুন)"></option><option value="Edit" data-i="Edit|Edit (এডিট)"></option><option value="Delete" data-i="Delete|Delete (ডিলিট)"></option>
    </select>
    <select id="fEnt" class="in-f" style="flex:none;min-width:140px"></select>
    <input id="fFrom" type="date" class="in-f" style="flex:none" title="From" />
    <input id="fTo" type="date" class="in-f" style="flex:none" title="To" />
    <input id="fQ" class="in-f" type="search" name="scs-activity-filter" autocomplete="off" readonly onpointerdown="this.removeAttribute('readonly')" onfocus="this.removeAttribute('readonly')" data-ph="Order no / name / user…|অর্ডার নং / নাম / ইউজার খুঁজুন…" />
  </div>
  <p class="small" id="info" style="margin:-4px 0 12px"></p>
  <div class="card" id="list"><div class="spin"></div></div>
  <div class="more hidden" id="moreBox"><button class="btn g" id="moreBtn" type="button" data-i="Load more|আরও দেখুন"></button></div>
</main>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/scs-core.js"></script>
<script src="assets/activity-diff.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var T = SCS.t, esc = SCS.esc, sb = SCS.sb, PAGE = 40;
  var params = new URLSearchParams(location.search);
  var EMBED = params.get('embed') === '1';
  if (EMBED) document.body.classList.add('embed');
  var st = { page: 0, items: [], done: false, users: {}, me: null, timer: null };
  var ENTS = {
    'chemical-order': ['Order', 'Product', 'Seller', 'Settings'],
    'attendance': ['Attendance', 'Employee', 'Settings'],
    'monthly-report': ['Monthly Report', 'Settings'],
    'core': ['User', 'App Access', 'Document', 'App', 'Admin PIN', 'System Settings']
  };
  SCS.applyI18n(); SCS.applyLogo();
  if (!SCS.configured) { location.href = SCS.url('/'); return; }
  SCS.loadBranding();

  function fill(me) {
    var apps = me.apps.filter(function (a) { return SCS.roleFor(me, a.key); });
    var opts = '<option value="">' + T('All apps', 'সব অ্যাপ') + '</option>' + apps.map(function (a) { return '<option value="' + esc(a.key) + '">' + esc((a.icon || '') + ' ' + a.name) + '</option>'; }).join('');
    if (me.isSuper) opts += '<option value="core">👥 ' + T('Users & system', 'ইউজার ও সিস্টেম') + '</option>';
    $('fApp').innerHTML = opts;
    var want = params.get('app') || '';
    if ([].some.call($('fApp').options, function (o) { return o.value === want; })) $('fApp').value = want;
    if (EMBED && want) $('fApp').style.display = 'none';
    fillEnt();
  }
  function fillEnt() {
    var app = $('fApp').value, list = app ? (ENTS[app] || []) : ['Order', 'Product', 'Seller', 'Attendance', 'Employee', 'Monthly Report', 'Settings'];
    $('fEnt').innerHTML = '<option value="">' + T('All types', 'সব ধরন') + '</option>' + list.map(function (x) { return '<option>' + esc(x) + '</option>'; }).join('');
  }

  function query() {
    var q = sb.from('audit_log').select('*').order('id', { ascending: false }).range(st.page * PAGE, st.page * PAGE + PAGE - 1);
    var app = $('fApp').value, a = $('fAct').value, en = $('fEnt').value, s = $('fQ').value.trim().replace(/[,()*]/g, ' ');
    if (app) q = q.eq('app_key', app); else q = q.neq('app_key', 'core');
    if (a) q = q.eq('action', a);
    if (en) q = q.eq('entity', en);
    if ($('fFrom').value) q = q.gte('at', $('fFrom').value + 'T00:00:00+06:00');
    if ($('fTo').value) q = q.lte('at', $('fTo').value + 'T23:59:59+06:00');
    if (s) q = q.or('record_ref.ilike.*' + s + '*,actor_name.ilike.*' + s + '*,actor_email.ilike.*' + s + '*');
    return SCS.q(q);
  }
  function reload() { st.page = 0; st.items = []; st.done = false; $('list').innerHTML = '<div class="spin"></div>'; more(); }
  function more() {
    $('moreBtn').disabled = true;
    query().then(function (rows) {
      st.items = st.items.concat(rows); st.done = rows.length < PAGE; st.page++; render();
    }).catch(function (e) { $('list').innerHTML = '<div class="empty">' + esc(SCS.err(e)) + '</div>'; })
      .then(function () { $('moreBtn').disabled = false; });
  }

  var APPNAME = {};
  var ACT_TXT = { Add: T('Add', 'নতুন'), Edit: T('Edit', 'এডিট'), Delete: T('Delete', 'ডিলিট') };
  function render() {
    $('moreBox').classList.toggle('hidden', st.done);
    $('info').textContent = st.items.length ? (st.items.length + (st.done ? '' : '+') + T(' changes · red = before, green = after', ' টি পরিবর্তন · লাল = আগে ছিল, সবুজ = পরে হয়েছে')) : '';
    if (!st.items.length) { $('list').innerHTML = '<div class="empty">' + T('No activity found.', 'কোনো অ্যাক্টিভিটি পাওয়া যায়নি।') + '</div>'; return; }
    $('list').innerHTML = st.items.map(function (h) {
      var ref = h.record_ref || '';
      if (h.app_key === 'core' && st.users[ref]) ref = st.users[ref];
      return '<div class="ev" data-id="' + h.id + '"><div class="hd"><span class="act ' + esc(h.action) + '">' + esc(ACT_TXT[h.action] || h.action) + '</span>' +
        '<div class="grow"><b>' + esc(h.entity || h.table_name) + '</b> · <b style="color:var(--brand)">' + esc(ref) + '</b>' +
        ($('fApp').value ? '' : ' <span class="badge">' + esc(APPNAME[h.app_key] || h.app_key) + '</span>') +
        '<div class="who">🕘 ' + esc(SCS.fmt(h.at, 'd MMM yyyy, HH:mm:ss')) + ' · 👤 <b>' + esc(h.actor_name || 'System') + '</b>' + (h.actor_email ? ' (' + esc(h.actor_email) + ')' : '') + '</div></div>' +
        (st.me && st.me.isSuper ? '<button type="button" class="del" data-del="' + h.id + '" title="' + T('Delete this log entry (Super Admin)', 'এই লগ মুছুন (Super Admin)') + '">🗑</button>' : '') + '</div>' +
        ActivityDiff.html(h.old_data, h.new_data, h.action, { users: st.users }) + '</div>';
    }).join('');
  }

  ['fApp', 'fAct', 'fEnt', 'fFrom', 'fTo'].forEach(function (id) {
    $(id).addEventListener('change', function () {
      if (id === 'fApp') { fillEnt(); var u = new URL(location.href); u.searchParams.set('app', $('fApp').value); history.replaceState(null, '', u); }
      reload();
    });
  });
  $('fQ').addEventListener('input', function () { clearTimeout(st.timer); st.timer = setTimeout(reload, 350); });
  $('moreBtn').addEventListener('click', more);
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-diff-all]');
    if (b) { b.parentElement.querySelectorAll('tr.x').forEach(function (r) { r.classList.remove('hidden'); }); b.remove(); }
    var d = e.target.closest('[data-del]');
    if (d) {
      if (!confirm(T('Delete this activity log entry permanently? This cannot be undone.', 'এই অ্যাক্টিভিটি লগটি স্থায়ীভাবে মুছবেন? আর ফেরত আনা যাবে না।'))) return;
      var id = Number(d.getAttribute('data-del'));
      SCS.q(sb.from('audit_log').delete().eq('id', id)).then(function () {
        st.items = st.items.filter(function (x) { return x.id !== id; }); render();
      }).catch(function (er) { alert(SCS.err(er)); });
    }
  });

  SCS.loadMe().then(function (me) {
    if (!me) { (EMBED ? top : window).location.href = SCS.url('/') + '?next=' + encodeURIComponent(SCS.url('/activity.html')); return; }
    if (!me.active) { location.href = SCS.url('/'); return; }
    st.me = me;
    if (!EMBED) SCS.portalHeader(me, $('topAct'));
    me.apps.forEach(function (a) { APPNAME[a.key] = a.name; });
    APPNAME.core = T('Users & system', 'ইউজার ও সিস্টেম');
    fill(me);
    var p = me.isSuper ? SCS.q(sb.from('profiles').select('id,email,full_name')).then(function (r) { r.forEach(function (u) { st.users[u.id] = (u.full_name ? u.full_name + ' — ' : '') + u.email; }); }) : Promise.resolve();
    return p.then(reload);
  }).catch(function (e) { $('list').innerHTML = '<div class="empty">' + esc(SCS.err(e)) + '</div>'; });
})();
</script>
</body>
</html>
