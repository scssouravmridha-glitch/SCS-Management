<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SCS Management</title>
<meta name="description" content="Swarup Construction Solution — management apps" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/portal.css" />
</head>
<body>
<div class="bg-art" aria-hidden="true"><span class="glow"></span><span class="ring r1"></span><span class="ring r2"></span><img data-scs-logo alt="" /></div>

<header class="top">
  <div class="in">
    <a class="logo" href="./"><span class="mk"><img data-scs-logo alt="SCS" /></span><span><b>SCS Management</b><small>Swarup Construction Solution</small></span></a>
    <div class="act" id="topAct"></div>
  </div>
</header>

<div id="vLoading"><div class="spin" style="margin-top:120px"></div></div>

<!-- not configured -->
<section id="vSetup" class="auth one hidden">
  <div class="card form">
    <h2 class="h1" data-i="Setup pending|সেটআপ বাকি আছে"></h2>
    <p class="sub" data-ih="Open <code>assets/config.js</code>, add your Supabase <b>URL</b> and <b>anon public key</b>, then deploy again.|ফাইল <code>assets/config.js</code> খুলে আপনার Supabase প্রজেক্টের <b>URL</b> ও <b>anon public key</b> বসিয়ে আবার ডিপ্লয় করুন।"></p>
  </div>
</section>

<!-- login / signup / forgot -->
<section id="vAuth" class="auth hidden">
  <div class="hero">
    <div class="big"><img data-scs-logo alt="SCS" /></div>
    <h1>SCS <span>Management</span></h1>
    <p data-i="One account for every SCS app.|এক অ্যাকাউন্টে সব SCS অ্যাপ।"></p>
    <div class="apps-mini" id="heroApps"></div>
  </div>
  <div class="card form">
    <div class="tabs" id="authTabs">
      <button type="button" data-t="login" class="on" data-i="Log in|লগইন"></button>
      <button type="button" data-t="signup" data-i="Create account|অ্যাকাউন্ট খুলুন"></button>
    </div>
    <div id="authMsg"></div>

    <form id="fLogin" autocomplete="on">
      <div class="field"><label class="l" for="liEmail" data-i="Email or mobile number|ইমেইল বা মোবাইল নম্বর"></label><input class="in-f" id="liEmail" autocomplete="username" placeholder="you@example.com / 01XXXXXXXXX" required /></div>
      <div class="field"><label class="l" for="liPass" data-i="Password|পাসওয়ার্ড"></label><input class="in-f" id="liPass" type="password" autocomplete="current-password" required /></div>
      <button class="btn p w" type="submit" data-i="Log in|লগইন করুন"></button>
      <div class="center" style="margin-top:14px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap">
        <button type="button" class="link" id="toSmsLogin" data-i="Log in with a code (SMS / email)|কোড দিয়ে লগইন (SMS / ইমেইল)"></button>
        <button type="button" class="link" id="toForgot" data-i="Forgot password?|পাসওয়ার্ড ভুলে গেছেন?"></button>
      </div>
    </form>

    <!-- login with SMS code -->
    <form id="fSmsLogin" class="hidden">
      <h2 class="h2" data-i="Log in with a code|কোড দিয়ে লগইন"></h2>
      <div class="field"><label class="l" for="slPhone" data-i="Mobile number (SMS) or email on your account|অ্যাকাউন্টের মোবাইল নম্বর (SMS) বা ইমেইল"></label>
        <div style="display:flex;gap:8px"><input class="in-f" id="slPhone" placeholder="01XXXXXXXXX / you@example.com" /><button class="btn g" type="button" id="slSend" style="flex:none" data-i="Send code|কোড পাঠান"></button></div></div>
      <div class="field"><label class="l" for="slCode" data-i="6-digit code|৬ সংখ্যার কোড"></label><input class="in-f otp" id="slCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" /></div>
      <button class="btn p w" type="submit" data-i="Log in|লগইন করুন"></button>
      <div class="center" style="margin-top:14px"><button type="button" class="link" data-back data-i="← Back to log in|← লগইনে ফিরুন"></button></div>
    </form>

    <form id="fSignup" class="hidden" autocomplete="on">
      <div class="field"><label class="l" for="suName"><span data-i="Full name|পূর্ণ নাম"></span> <span class="req">*</span></label><input class="in-f" id="suName" autocomplete="name" required /></div>
      <div class="field"><label class="l" for="suPhone"><span data-i="Mobile number|মোবাইল নম্বর"></span> <span class="req">*</span></label><input class="in-f" id="suPhone" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required /></div>
      <div class="field"><label class="l" for="suEmail"><span data-i="Email|ইমেইল"></span> <span class="req">*</span></label><input class="in-f" id="suEmail" type="email" autocomplete="email" required /></div>
      <div class="row2">
        <div class="field"><label class="l" for="suPass" data-i="Password (min 8)|পাসওয়ার্ড (৮+ অক্ষর)"></label><input class="in-f" id="suPass" type="password" minlength="8" autocomplete="new-password" required /></div>
        <div class="field"><label class="l" for="suPass2" data-i="Confirm password|আবার দিন"></label><input class="in-f" id="suPass2" type="password" minlength="8" autocomplete="new-password" required /></div>
      </div>
      <div class="field" id="suChBox"><label class="l" data-i="Verify my account by|অ্যাকাউন্ট যাচাই করবো"></label>
        <div class="tabs" id="suTabs" style="margin:0">
          <button type="button" data-ch="sms" class="on" data-i="📱 Mobile SMS code|📱 মোবাইল SMS কোড"></button>
          <button type="button" data-ch="email" data-i="✉️ Email code|✉️ ইমেইল কোড"></button>
        </div></div>
      <div class="field hidden" id="suCodeBox"><label class="l" for="suCode" id="suCodeLbl" data-i="6-digit code|৬ সংখ্যার কোড"></label><input class="in-f otp" id="suCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
        <div class="small" id="suCodeInfo" style="margin-top:6px"></div></div>
      <button class="btn p w" type="submit" id="suBtn" data-i="Send verification code|যাচাইয়ের কোড পাঠান"></button>
      <p class="small center" style="margin:12px 0 0" data-i="We send a 6-digit code to your mobile or email. After you log in you will add your photo; the admin then approves your account.|আপনার মোবাইল বা ইমেইলে ৬ সংখ্যার কোড যাবে। লগইনের পর প্রোফাইল ছবি দেবেন, তারপর অ্যাডমিন অনুমোদন দেবেন।"></p>
    </form>

    <!-- forgot: step 1 -->
    <form id="fForgot" class="hidden">
      <h2 class="h2" data-i="Reset password|পাসওয়ার্ড রিসেট"></h2>
      <div class="tabs" id="fgTabs" style="margin-bottom:14px">
        <button type="button" data-m="sms" class="on" data-i="By mobile SMS|মোবাইল SMS এ"></button>
        <button type="button" data-m="email" data-i="By email|ইমেইলে"></button>
      </div>
      <div class="field hidden" id="fgEmailBox"><label class="l" for="fgEmail" data-i="Your account email|আপনার অ্যাকাউন্টের ইমেইল"></label><input class="in-f" id="fgEmail" type="email" autocomplete="email" /></div>
      <div class="field" id="fgPhoneBox"><label class="l" for="fgPhone" data-i="Mobile number on your account|অ্যাকাউন্টের মোবাইল নম্বর"></label><input class="in-f" id="fgPhone" inputmode="tel" placeholder="01XXXXXXXXX" /></div>
      <button class="btn p w" type="submit" data-i="Send reset code|রিসেট কোড পাঠান"></button>
      <div class="center" style="margin-top:14px"><button type="button" class="link" data-back data-i="← Back to log in|← লগইনে ফিরুন"></button></div>
    </form>

    <!-- forgot: step 2 -->
    <form id="fCode" class="hidden">
      <h2 class="h2" data-i="Enter the code|কোড দিন"></h2>
      <p class="small" id="codeInfo" style="margin-top:-4px"></p>
      <div class="field"><label class="l" for="cdCode" data-i="6-digit code|৬ সংখ্যার কোড"></label><input class="in-f otp" id="cdCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required /></div>
      <div class="row2">
        <div class="field"><label class="l" for="cdPass" data-i="New password|নতুন পাসওয়ার্ড"></label><input class="in-f" id="cdPass" type="password" minlength="8" autocomplete="new-password" required /></div>
        <div class="field"><label class="l" for="cdPass2" data-i="Confirm|আবার দিন"></label><input class="in-f" id="cdPass2" type="password" minlength="8" autocomplete="new-password" required /></div>
      </div>
      <button class="btn p w" type="submit" data-i="Save new password|নতুন পাসওয়ার্ড সেভ করুন"></button>
      <div class="center" style="margin-top:14px;display:flex;justify-content:center;gap:16px">
        <button type="button" class="link" id="resend" data-i="Send again|আবার পাঠান"></button>
        <button type="button" class="link" data-back data-i="← Back to log in|← লগইনে ফিরুন"></button>
      </div>
    </form>
  </div>
</section>

<!-- set new password (from reset email link) -->
<section id="vReset" class="auth one hidden">
  <div class="card form">
    <h2 class="h1" data-i="Set a new password|নতুন পাসওয়ার্ড দিন"></h2>
    <div id="resetMsg"></div>
    <form id="fReset">
      <div class="field"><label class="l" for="rpPass" data-i="New password|নতুন পাসওয়ার্ড"></label><input class="in-f" id="rpPass" type="password" minlength="8" autocomplete="new-password" required /></div>
      <div class="field"><label class="l" for="rpPass2" data-i="Confirm|আবার দিন"></label><input class="in-f" id="rpPass2" type="password" minlength="8" autocomplete="new-password" required /></div>
      <button class="btn p w" type="submit" data-i="Save password|পাসওয়ার্ড সেভ করুন"></button>
    </form>
  </div>
</section>

<!-- pending / disabled -->
<section id="vPending" class="auth one hidden">
  <div class="card form center">
    <div style="font-size:46px">⏳</div>
    <h2 class="h1" id="pendTitle"></h2>
    <p class="sub" id="pendText"></p>
    <p class="small" id="pendWho"></p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap">
      <a class="btn g" href="profile.html" data-i="My profile|আমার প্রোফাইল"></a>
      <button class="btn g" type="button" onclick="location.reload()" data-i="Refresh|রিফ্রেশ"></button>
      <button class="btn p" type="button" data-logout data-i="Log out|লগআউট"></button>
    </div>
  </div>
</section>

<!-- dashboard -->
<main id="vHome" class="wrap hidden">
  <div class="hero-band">
    <div class="welcome">
      <img class="av-l" id="hAvatar" alt="" />
      <div class="grow"><div class="small" id="hDate"></div><h1 class="h1" id="hello"></h1></div>
    </div>
    <div class="stats" id="hStats"></div>
  </div>
  <div class="grid" id="appGrid"></div>
</main>

<div id="toast" class="toast hidden"></div>

<script src="assets/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/scs-core.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var T = SCS.t, esc = SCS.esc;
  var VIEWS = ['vLoading', 'vSetup', 'vAuth', 'vReset', 'vPending', 'vHome'];
  function show(v) { VIEWS.forEach(function (x) { $(x).classList.toggle('hidden', x !== v); }); }
  function msg(el, text, type) { $(el).innerHTML = text ? '<div class="msg ' + (type || 'info') + '">' + esc(text) + '</div>' : ''; }
  var tt = null;
  function toast(t) { var e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(function () { e.classList.add('hidden'); }, 3200); }
  var next = new URLSearchParams(location.search).get('next');
  if (next && !/^\/[^/]/.test(next)) next = null;

  SCS.applyI18n(); SCS.applyLogo();
  function langSwitch() {
    return '<div class="seg"><button type="button" data-lang="en" class="' + (SCS.lang === 'en' ? 'on' : '') + '">EN</button><button type="button" data-lang="bn" class="' + (SCS.lang === 'bn' ? 'on' : '') + '">বাং</button></div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.seg [data-lang]');
    if (b) { SCS.setLang(b.getAttribute('data-lang')); $('topAct').innerHTML = langSwitch(); }
  });

  if (!SCS.configured) { $('topAct').innerHTML = langSwitch(); show('vSetup'); return; }
  var sb = SCS.sb, recovering = false;
  SCS.loadBranding();

  /* ---------- auth forms ---------- */
  var FORMS = { login: 'fLogin', sms: 'fSmsLogin', signup: 'fSignup', forgot: 'fForgot', code: 'fCode' };
  function authTab(t) {
    document.querySelectorAll('#authTabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    $('authTabs').classList.toggle('hidden', t === 'forgot' || t === 'code' || t === 'sms');
    Object.keys(FORMS).forEach(function (k) { $(FORMS[k]).classList.toggle('hidden', k !== t); });
    msg('authMsg', '');
  }
  document.querySelectorAll('#authTabs button').forEach(function (b) { b.onclick = function () { authTab(b.dataset.t); }; });
  $('toForgot').onclick = function () { var v = $('liEmail').value.trim(); if (/@/.test(v)) $('fgEmail').value = v; else if (v) $('fgPhone').value = v; authTab('forgot'); };
  $('toSmsLogin').onclick = function () { var v = $('liEmail').value.trim(); if (v) $('slPhone').value = v; authTab('sms'); };
  // কোন পদ্ধতিতে কোড পাঠানো যায় (SMS / ইমেইল) — সার্ভার জানায়
  var CH = { sms: true, email: false };
  if (SCS.configured) SCS.callFn('password-reset', { action: 'channels' }, { anon: true }).then(function (r) {
    CH = r || CH;
    if (!CH.sms && CH.email) { su.ch = 'email'; paintSuTabs(); }
  }).catch(function () {});
  /** মোবাইল বা ইমেইল দেখে কোন চ্যানেল */
  function idBody(v) { v = String(v || '').trim(); return /@/.test(v) ? { channel: 'email', email: v } : { channel: 'sms', phone: v }; }
  document.querySelectorAll('[data-back]').forEach(function (b) { b.onclick = function () { authTab('login'); }; });
  function busy(form, on) { form.querySelectorAll('button').forEach(function (b) { b.disabled = on; }); }
  function isPhone(v) { return /^(\+?88)?01[3-9]\d{8}$/.test(String(v || '').replace(/[\s-]/g, '')); }
  function sms(body) { return SCS.callFn('password-reset', body, { anon: true }); }

  /* ---------- login: email or mobile + password ---------- */
  $('fLogin').onsubmit = function (e) {
    e.preventDefault(); var f = e.target; busy(f, true); msg('authMsg', '');
    var id = $('liEmail').value.trim(), pass = $('liPass').value;
    var p;
    if (isPhone(id)) {
      p = sms({ action: 'loginPassword', phone: id, password: pass }).then(function (r) { return sb.auth.setSession(r.session); })
        .then(function (r) { if (r && r.error) throw r.error; });
    } else {
      p = sb.auth.signInWithPassword({ email: id, password: pass }).then(function (r) {
        if (r.error) throw new Error(/Invalid login/i.test(r.error.message) ? T('Wrong email or password.', 'ইমেইল বা পাসওয়ার্ড ভুল।') : /confirm/i.test(r.error.message) ? T('Email not confirmed yet. Log in with your mobile number, or ask the admin.', 'ইমেইল কনফার্ম হয়নি। মোবাইল নম্বর দিয়ে লগইন করুন বা অ্যাডমিনকে জানান।') : r.error.message);
      });
    }
    p.then(function () { busy(f, false); route(); }).catch(function (er) { busy(f, false); msg('authMsg', SCS.err(er), 'bad'); });
  };

  /* ---------- login with SMS code ---------- */
  $('slSend').onclick = function () {
    var ph = $('slPhone').value.trim();
    if (!isPhone(ph) && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(ph)) { msg('authMsg', T('Enter your mobile number (01XXXXXXXXX) or email.', 'মোবাইল নম্বর (01XXXXXXXXX) বা ইমেইল দিন।'), 'bad'); return; }
    $('slSend').disabled = true; msg('authMsg', '');
    sms(Object.assign({ action: 'send', purpose: 'login' }, idBody(ph))).then(function (r) {
      msg('authMsg', T('Code sent to ', 'কোড পাঠানো হয়েছে: ') + r.to, 'ok'); $('slCode').focus();
    }).catch(function (er) { msg('authMsg', SCS.err(er), 'bad'); }).then(function () { setTimeout(function () { $('slSend').disabled = false; }, 30000); });
  };
  $('fSmsLogin').onsubmit = function (e) {
    e.preventDefault(); var f = e.target; busy(f, true); msg('authMsg', '');
    sms(Object.assign({ action: 'login', code: $('slCode').value.replace(/\D/g, '') }, idBody($('slPhone').value))).then(function (r) {
      return sb.auth.verifyOtp({ token_hash: r.token_hash, type: 'magiclink' });
    }).then(function (r) { if (r && r.error) throw r.error; busy(f, false); route(); })
      .catch(function (er) { busy(f, false); msg('authMsg', SCS.err(er), 'bad'); });
  };

  /* ---------- sign up: mobile SMS code (no email needed) ---------- */
  var su = { codeSent: false, ch: 'sms' };
  function paintSuTabs() {
    document.querySelectorAll('#suTabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.ch === su.ch); });
    su.codeSent = false; $('suCodeBox').classList.add('hidden');
    $('suBtn').textContent = su.ch === 'email' ? T('Send code to my email', 'ইমেইলে কোড পাঠান') : T('Send code to my mobile', 'মোবাইলে কোড পাঠান');
  }
  document.querySelectorAll('#suTabs button').forEach(function (b) { b.onclick = function () { su.ch = b.dataset.ch; paintSuTabs(); msg('authMsg', ''); }; });
  function suSendBody(d) { return su.ch === 'email' ? { action: 'send', purpose: 'signup', channel: 'email', email: d.email } : { action: 'send', purpose: 'signup', channel: 'sms', phone: d.phone }; }
  function suData() {
    return { full_name: $('suName').value.trim(), phone: $('suPhone').value.replace(/[\s-]/g, ''), email: $('suEmail').value.trim(), password: $('suPass').value };
  }
  function emailSignup(d, f) {
    return sb.auth.signUp({ email: d.email, password: d.password, options: { data: { full_name: d.full_name, phone: d.phone }, emailRedirectTo: SCS.siteUrl() } }).then(function (r) {
      busy(f, false);
      if (r.error) { msg('authMsg', /registered/i.test(r.error.message) ? T('An account with this email already exists — log in.', 'এই ইমেইলে আগেই অ্যাকাউন্ট আছে — লগইন করুন।') : /rate limit/i.test(r.error.message) ? T('Email limit reached. Ask the admin to set up the SMS gateway, or try again after an hour.', 'ইমেইলের লিমিট শেষ। অ্যাডমিনকে SMS গেটওয়ে সেট করতে বলুন, অথবা ১ ঘণ্টা পর চেষ্টা করুন।') : r.error.message, 'bad'); return; }
      if (r.data && r.data.session) { route(); return; }
      authTab('login'); $('liEmail').value = d.email;
      msg('authMsg', T('Account created! Click the confirmation link we emailed you, then log in.', 'অ্যাকাউন্ট তৈরি হয়েছে! ইমেইলে পাঠানো কনফার্মেশন লিংকে ক্লিক করুন, তারপর লগইন করুন।'), 'ok');
    });
  }
  $('fSignup').onsubmit = function (e) {
    e.preventDefault(); var f = e.target, d = suData();
    if (d.password !== $('suPass2').value) { msg('authMsg', T('The two passwords do not match.', 'দুটি পাসওয়ার্ড মিলছে না।'), 'bad'); return; }
    if (!isPhone(d.phone)) { msg('authMsg', T('Enter a valid mobile number (01XXXXXXXXX).', 'সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)।'), 'bad'); return; }
    busy(f, true); msg('authMsg', '');
    if (!su.codeSent) {
      if (su.ch === 'email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) { busy(f, false); msg('authMsg', T('Enter a valid email.', 'সঠিক ইমেইল দিন।'), 'bad'); return; }
      sms(suSendBody(d)).then(function (r) {
        busy(f, false); su.codeSent = true;
        $('suCodeBox').classList.remove('hidden');
        $('suCodeInfo').innerHTML = esc(T('Code sent to ', 'কোড পাঠানো হয়েছে: ') + r.to) + ' · <button type="button" class="link" id="suResend">' + T('Send again', 'আবার পাঠান') + '</button>';
        $('suBtn').textContent = T('Create account', 'অ্যাকাউন্ট খুলুন');
        $('suCode').focus();
      }).catch(function (er) {
        // বেছে নেওয়া পদ্ধতি সেট না থাকলে: অন্যটা চালু থাকলে সেটা বলি, নইলে Supabase ইমেইল দিয়ে অ্যাকাউন্ট
        if (/not set up|turned off/i.test(er.message) && ((su.ch === 'sms' && CH.email) || (su.ch === 'email' && CH.sms))) {
          busy(f, false); msg('authMsg', su.ch === 'sms' ? T('SMS is not set up yet — choose "Email code".', 'SMS এখনো সেট হয়নি — "ইমেইল কোড" বেছে নিন।') : T('Email is not set up yet — choose "Mobile SMS code".', 'ইমেইল এখনো সেট হয়নি — "মোবাইল SMS কোড" বেছে নিন।'), 'bad'); return;
        }
        if (/not set up|turned off|function not found|Server error 404/i.test(er.message)) { msg('authMsg', T('Codes are not set up yet — creating the account with email instead…', 'কোড পাঠানো এখনো সেট হয়নি — ইমেইল দিয়ে অ্যাকাউন্ট তৈরি হচ্ছে…'), 'info'); emailSignup(d, f); return; }
        busy(f, false); msg('authMsg', SCS.err(er), 'bad');
      });
      return;
    }
    sms({ action: 'signup', channel: su.ch, phone: d.phone, code: $('suCode').value.replace(/\D/g, ''), email: d.email, password: d.password, full_name: d.full_name }).then(function () {
      return sb.auth.signInWithPassword({ email: d.email, password: d.password });
    }).then(function (r) {
      busy(f, false);
      if (r.error) throw r.error;
      route();
    }).catch(function (er) { busy(f, false); msg('authMsg', SCS.err(er), 'bad'); });
  };
  document.addEventListener('click', function (e) {
    if (e.target.id !== 'suResend') return;
    var d = suData();
    sms(suSendBody(d)).then(function (r) { toast(T('Code sent again', 'কোড আবার পাঠানো হয়েছে')); }).catch(function (er) { msg('authMsg', SCS.err(er), 'bad'); });
  });
  $('suPhone').addEventListener('input', function () { if (su.ch === 'sms') paintSuTabs(); });
  $('suEmail').addEventListener('input', function () { if (su.ch === 'email') paintSuTabs(); });
  paintSuTabs();

  /* ---------- forgot password (email code / link, or mobile SMS code) ---------- */
  var fg = { mode: 'sms', email: '', phone: '', via: 'fn' };
  document.querySelectorAll('#fgTabs button').forEach(function (b) {
    b.onclick = function () {
      fg.mode = b.dataset.m;
      document.querySelectorAll('#fgTabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      $('fgEmailBox').classList.toggle('hidden', fg.mode !== 'email');
      $('fgPhoneBox').classList.toggle('hidden', fg.mode !== 'sms');
      msg('authMsg', '');
    };
  });
  function sendCode() {
    if (fg.mode === 'email') {
      fg.via = 'fn';
      return sms({ action: 'send', purpose: 'reset', channel: 'email', email: fg.email }).then(function (r) {
        return T('We emailed a 6-digit code to ', '৬ সংখ্যার কোড ইমেইলে পাঠানো হয়েছে: ') + r.to;
      }, function (er) {
        if (!/not set up|function not found|Server error 404/i.test(er.message)) throw er;
        // SMTP সেট না থাকলে Supabase এর নিজের ইমেইল
        fg.via = 'supabase';
        return sb.auth.resetPasswordForEmail(fg.email, { redirectTo: SCS.siteUrl() }).then(function (r) {
          if (r.error) throw r.error;
          return T('We emailed a 6-digit code to ', '৬ সংখ্যার কোড পাঠানো হয়েছে: ') + fg.email + T('. (You can also just click the link in that email.)', '। (ইমেইলের লিংকে ক্লিক করেও রিসেট করা যায়।)');
        });
      });
    }
    return sms({ action: 'send', purpose: 'reset', phone: fg.phone }).then(function (r) {
      return T('We sent a 6-digit code by SMS to ', '৬ সংখ্যার কোড SMS এ পাঠানো হয়েছে: ') + r.to;
    });
  }
  $('fForgot').onsubmit = function (e) {
    e.preventDefault(); var f = e.target;
    fg.email = $('fgEmail').value.trim(); fg.phone = $('fgPhone').value.trim();
    if (fg.mode === 'email' && !fg.email) { msg('authMsg', T('Enter your email.', 'ইমেইল দিন।'), 'bad'); return; }
    if (fg.mode === 'sms' && !fg.phone) { msg('authMsg', T('Enter your mobile number.', 'মোবাইল নম্বর দিন।'), 'bad'); return; }
    busy(f, true); msg('authMsg', '');
    sendCode().then(function (info) {
      busy(f, false); authTab('code'); $('codeInfo').textContent = info; $('cdCode').focus();
    }).catch(function (er) { busy(f, false); msg('authMsg', SCS.err(er), 'bad'); });
  };
  $('resend').onclick = function () {
    msg('authMsg', '');
    sendCode().then(function (info) { $('codeInfo').textContent = info; toast(T('Code sent again', 'কোড আবার পাঠানো হয়েছে')); }).catch(function (er) { msg('authMsg', SCS.err(er), 'bad'); });
  };
  $('fCode').onsubmit = function (e) {
    e.preventDefault(); var f = e.target;
    var code = $('cdCode').value.replace(/\D/g, ''), pass = $('cdPass').value;
    if (pass !== $('cdPass2').value) { msg('authMsg', T('The two passwords do not match.', 'দুটি পাসওয়ার্ড মিলছে না।'), 'bad'); return; }
    busy(f, true); msg('authMsg', '');
    var p;
    if (fg.mode === 'email' && fg.via === 'fn') {
      p = sms({ action: 'verify', channel: 'email', email: fg.email, code: code, password: pass }).then(function (r) {
        return sb.auth.signInWithPassword({ email: r.email, password: pass });
      }).then(function (r) { if (r && r.error) throw r.error; });
    } else if (fg.mode === 'email') {
      p = sb.auth.verifyOtp({ email: fg.email, token: code, type: 'recovery' }).then(function (r) {
        if (r.error) throw new Error(/expired|invalid/i.test(r.error.message) ? T('Wrong or expired code.', 'কোড ভুল বা মেয়াদ শেষ।') : r.error.message);
        return sb.auth.updateUser({ password: pass });
      }).then(function (r) { if (r.error) throw r.error; });
    } else {
      p = sms({ action: 'verify', phone: fg.phone, code: code, password: pass }).then(function (r) {
        return sb.auth.signInWithPassword({ email: r.email, password: pass });
      });
    }
    p.then(function () {
      busy(f, false); toast(T('Password changed', 'পাসওয়ার্ড বদলানো হয়েছে')); route();
    }).catch(function (er) { busy(f, false); msg('authMsg', SCS.err(er), 'bad'); });
  };

  $('fReset').onsubmit = function (e) {
    e.preventDefault();
    if ($('rpPass').value !== $('rpPass2').value) { msg('resetMsg', T('The two passwords do not match.', 'দুটি পাসওয়ার্ড মিলছে না।'), 'bad'); return; }
    sb.auth.updateUser({ password: $('rpPass').value }).then(function (r) {
      if (r.error) { msg('resetMsg', r.error.message, 'bad'); return; }
      recovering = false; toast(T('Password changed', 'পাসওয়ার্ড বদলানো হয়েছে')); history.replaceState(null, '', '/'); route();
    });
  };

  document.addEventListener('click', function (e) { if (e.target.closest('[data-logout]')) SCS.signOut(); });

  /* ---------- top bar ---------- */
  function topBar(me) {
    $('topAct').innerHTML = '';
    if (!me) { $('topAct').innerHTML = langSwitch(); return; }
    SCS.portalHeader(me, $('topAct'));
  }

  /* ---------- home ---------- */
  function renderHome(me) {
    var h = Number(SCS.fmt(new Date(), 'HH'));
    var greet = h < 12 ? T('Good morning', 'শুভ সকাল') : h < 17 ? T('Good afternoon', 'শুভ অপরাহ্ন') : T('Good evening', 'শুভ সন্ধ্যা');
    $('hello').textContent = greet + ', ' + me.name.split(' ')[0];
    $('hDate').textContent = new Intl.DateTimeFormat(SCS.lang === 'bn' ? 'bn-BD' : 'en-GB', { timeZone: 'Asia/Dhaka', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
    $('hAvatar').src = me.photo || SCS.logo;
    var nApps = me.apps.filter(function (a) { return SCS.roleFor(me, a.key); }).length;
    var nAdmin = me.apps.filter(function (a) { return SCS.roleFor(me, a.key) === 'admin'; }).length;
    $('hStats').innerHTML = '<span>🧩 ' + nApps + ' ' + T('apps', 'টি অ্যাপ') + '</span>' +
      (nAdmin ? '<span>🔐 ' + T('Admin in ', 'অ্যাডমিন: ') + nAdmin + '</span>' : '') +
      (me.profile.employee_id ? '<span>🪪 ' + esc(me.profile.employee_id) + '</span>' : '') +
      (me.isSuper ? '<span>★ Super Admin</span>' : '');
    var apps = me.apps.slice().sort(function (a, b) { return (SCS.roleFor(me, b.key) ? 1 : 0) - (SCS.roleFor(me, a.key) ? 1 : 0); });
    $('appGrid').innerHTML = apps.map(function (a) {
      var role = SCS.roleFor(me, a.key);
      var nm = SCS.lang === 'bn' && a.name_bn ? a.name_bn : a.name;
      var ext = /^https?:/i.test(a.path || '');
      return '<a class="card app' + (role ? '' : ' off') + '" style="--c:' + esc(a.color || '#e91e63') + '" href="' + (role ? esc(SCS.url(a.path)) : '#') + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + '>' +
        '<div class="ic">' + esc(a.icon || '📦') + '</div>' +
        '<div><h3>' + esc(nm) + '</h3><p>' + esc(a.description || '') + '</p></div>' +
        '<div class="ft">' + (role ? '<span class="badge ' + role + '">' + role + '</span><span class="go">→</span>' : '<span class="badge">🔒 ' + T('No access', 'অ্যাক্সেস নেই') + '</span>') + '</div></a>';
    }).join('') || '<div class="empty">' + T('No apps yet.', 'কোনো অ্যাপ নেই।') + '</div>';
  }

  /* ---------- router ---------- */
  function route() {
    if (recovering) { show('vReset'); return; }
    show('vLoading');
    SCS.loadMe().then(function (me) {
      topBar(me);
      if (!me) {
        sb.from('apps').select('icon').eq('active', true).order('sort_order').then(function (r) {
          $('heroApps').innerHTML = ((r && r.data) || []).map(function (a) { return '<span>' + esc(a.icon || '📦') + '</span>'; }).join('');
        });
        show('vAuth'); return;
      }
      if (me.profile.status === 'disabled') {
        $('pendTitle').textContent = T('Account disabled', 'অ্যাকাউন্ট বন্ধ');
        $('pendText').textContent = T('Your account has been disabled by the admin.', 'আপনার অ্যাকাউন্টটি অ্যাডমিন বন্ধ করে রেখেছেন।');
        $('pendWho').textContent = me.email; show('vPending'); return;
      }
      if (!me.complete) { location.replace(SCS.url('/profile.html') + (next ? '?next=' + encodeURIComponent(next) : '')); return; }
      if (!me.active) {
        $('pendTitle').textContent = T('Waiting for approval', 'অনুমোদনের অপেক্ষায়');
        $('pendText').textContent = T('Your account is ready. When the admin approves it and gives app access, your apps will appear here.', 'আপনার অ্যাকাউন্ট তৈরি হয়েছে। অ্যাডমিন অনুমোদন দিয়ে অ্যাপের অ্যাক্সেস দিলে এখানে অ্যাপগুলো দেখতে পাবেন।');
        $('pendWho').textContent = me.email; show('vPending'); return;
      }
      if (next) {
        var key = (next.match(/^\/apps\/([^/]+)/) || [])[1];
        if (!key || SCS.roleFor(me, key)) { location.replace(next); return; }
      }
      renderHome(me); show('vHome');
    }).catch(function (e) { topBar(null); show('vAuth'); msg('authMsg', SCS.err(e), 'bad'); });
  }

  sb.auth.onAuthStateChange(function (ev) {
    if (ev === 'PASSWORD_RECOVERY') { recovering = true; show('vReset'); }
  });
  if (/type=recovery/.test(location.hash)) recovering = true;
  var hashErr = /error_description=([^&]+)/.exec(location.hash);
  route();
  if (hashErr) { setTimeout(function () { msg('authMsg', decodeURIComponent(hashErr[1].replace(/\+/g, ' ')) + T(' — ask for a new code below.', ' — নিচে থেকে নতুন কোড নিন।'), 'bad'); authTab('forgot'); }, 400); history.replaceState(null, '', '/'); }
})();
</script>
</body>
</html>
