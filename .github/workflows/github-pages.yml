# SCS Management — GitHub Pages এ ডিপ্লয়
# main ব্রাঞ্চে কিছু আপলোড/commit করলেই নিজে থেকে চলে।
# শুধু ওয়েবসাইটের ফাইল যায়; সার্ভার কোড (netlify, supabase), নোট (.md) আর পুরনো সোর্স যায় না।
# একবার চালু করতে: GitHub repo > Settings > Pages > Build and deployment > Source = "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect website files
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ \
            --exclude '.git' --exclude '.github' --exclude 'netlify' --exclude 'netlify.toml' \
            --exclude 'supabase' --exclude 'tools' --exclude '*.gs.txt' --exclude 'google-drive-backup' --exclude 'apps/scs-leave-application' \
            --exclude '*.md'
          touch /tmp/site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site
      - id: deployment
        uses: actions/deploy-pages@v4
